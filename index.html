<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz de grammaire française – Classe IX">
<style>html,body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Cahier de Grammaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap">
<style>
:root{
  --paper:#F8F9FD; --sheet:#FFFFFF; --ink:#1D2340; --ink-soft:#5A6082;
  --line:#E3E6F6; --line-strong:#C3C9EE; --margin:#D8454F;
  --accent:#2446C8; --accent-soft:#E6EBFC;
  --good:#1D7F55; --good-soft:#E3F4EC; --bad:#BF3440; --bad-soft:#FBE7E9;
  --shadow:0 1px 2px rgba(29,35,64,.06),0 8px 28px rgba(29,35,64,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#12152A; --sheet:#1A1E38; --ink:#E7E9F7; --ink-soft:#A3A8C8;
  --line:#242A4C; --line-strong:#353D6E; --margin:#E8656E;
  --accent:#8EA6FF; --accent-soft:#252E5C;
  --good:#5FD19C; --good-soft:#18362C; --bad:#FF8A93; --bad-soft:#3E1C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#12152A; --sheet:#1A1E38; --ink:#E7E9F7; --ink-soft:#A3A8C8;
  --line:#242A4C; --line-strong:#353D6E; --margin:#E8656E;
  --accent:#8EA6FF; --accent-soft:#252E5C;
  --good:#5FD19C; --good-soft:#18362C; --bad:#FF8A93; --bad-soft:#3E1C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--ink-soft);font-size:14px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08);color:var(--sheet)}
.btn:focus-visible,.opt:focus-visible,.chip input:focus-visible+span,.count input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* settings */
#settings{background:var(--sheet);border:1px solid var(--line-strong);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
#settings h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.chips,.counts{display:flex;flex-wrap:wrap;gap:8px}
.chip,.count{position:relative}
.chip input,.count input{position:absolute;opacity:0;pointer-events:none}
.chip span,.count span{display:inline-flex;gap:6px;align-items:baseline;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);cursor:pointer;font-size:14px;user-select:none}
.chip span b{font-size:11px;color:var(--ink-soft);font-weight:700}
.chip input:checked+span,.count input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip input:checked+span b{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#quizArea{display:flex;flex-direction:column;gap:18px}
#quizArea[hidden]{display:none}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.level{position:relative;display:flex}
.level input{position:absolute;opacity:0;pointer-events:none}
.level span{flex:1;display:flex;flex-direction:column;gap:4px;padding:16px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--sheet)}
.level strong{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:24px;line-height:1.2}
.level em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.level small{font-size:13.5px;color:var(--ink-soft);line-height:1.45;margin-top:4px}
.level span:hover{border-color:var(--accent)}
.level input:checked+span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.level input:checked+span em{color:var(--accent)}
.level input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.lvl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-left:6px;border:1px solid var(--line-strong);color:var(--ink-soft)}
@media (max-width:520px){.levels{grid-template-columns:1fr}}
.warn{color:var(--bad);font-size:14px;margin:0}

/* progress */
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score b{color:var(--ink)}

/* notebook sheet */
.sheet{position:relative;background:var(--sheet);border-radius:4px 12px 12px 4px;box-shadow:var(--shadow);
  padding:26px 22px 22px 58px;overflow:hidden;
  background-image:
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--line-strong) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 7px,var(--line) 7px 8px);
  background-position:0 14px;}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:var(--margin);opacity:.75}
.qnum{position:absolute;left:0;width:40px;top:28px;text-align:center;font-family:"Young Serif",Georgia,serif;color:var(--margin);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:4px}
.instr{margin:10px 0 0;font-weight:700;font-size:15px}
.sentence{font-family:"Young Serif",Georgia,serif;font-size:clamp(20px,3.6vw,25px);line-height:1.5;margin:18px 0 6px;text-wrap:pretty}
.sentence u{text-decoration-color:var(--margin);text-decoration-thickness:2px;text-underline-offset:4px}
.hint{color:var(--ink-soft);font-size:14px;font-style:italic;margin:0}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px dashed var(--ink-soft);text-align:center;padding:0 4px;line-height:1.2}
.blank.filled{border-bottom-style:solid;border-color:var(--good);font-family:"Caveat",cursive;font-size:1.35em;color:var(--accent);min-width:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt kbd{font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:4px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.opt.ok kbd{border-color:var(--good);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad kbd{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:14px 16px;border-radius:8px;border-left:4px solid var(--good);background:var(--good-soft);display:flex;flex-direction:column;gap:4px}
.fb.no{border-left-color:var(--bad);background:var(--bad-soft)}
.fb strong{font-size:15px}
.fb p{margin:0;font-size:15px}
.next{display:flex;justify-content:flex-end;margin-top:16px}

/* results */
.big{font-family:"Young Serif",Georgia,serif;font-size:52px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--ink-soft)}
.cats{display:flex;flex-direction:column;gap:10px;margin:20px 0}
.cat{display:grid;grid-template-columns:minmax(0,11em) 1fr 3.5em;gap:10px;align-items:center;font-size:14px}
.cat .bar{height:8px}
.cat .bar i.low{background:var(--bad)}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.review h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 0}
.rv{padding:12px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--sheet);font-size:15px;display:flex;flex-direction:column;gap:4px}
.rv .q{font-family:"Young Serif",Georgia,serif}
.rv .y{color:var(--bad)} .rv .c{color:var(--good)}
.foot{font-size:13px;color:var(--ink-soft);text-align:center}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .sheet{padding:22px 16px 18px 46px}
  .sheet::before{left:30px}
  .qnum{width:30px;font-size:13px}
  .cat{grid-template-columns:1fr 3em}
  .cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Cahier de Grammaire</h1>
      <p class="sub">Classe IX · Français (018) · Section C du modèle de mi-trimestre</p>
    </div>
    <button class="btn" id="toggleSettings" hidden>Changer de niveau</button>
  </header>

  <section id="settings">
    <h2>Choisissez votre niveau</h2>
    <div class="levels" id="levels">
      <label class="level"><input type="radio" name="level" id="level-easy" value="easy"><span>
        <strong>Facile</strong>
        <em>Pour commencer</em>
        <small>Présent, passé composé avec avoir, futur et impératif · ne … pas / jamais / rien · questions simples (Où, Quand, Qui…) · un seul pronom · noms sans piège</small>
      </span></label>
      <label class="level"><input type="radio" name="level" id="level-hard" value="hard"><span>
        <strong>Difficile</strong>
        <em>Pour l'examen</em>
        <small>Tous les temps + imparfait, verbes avec être et accord · négation au passé composé, personne ne…, pas de · -t-, Qu'est-ce qui, Depuis quand · deux pronoms, impératif · h muet, mon amie, leur / leurs</small>
      </span></label>
    </div>
    <h2>Sections à réviser</h2>
    <div class="chips" id="chips"></div>
    <h2>Nombre de questions</h2>
    <div class="counts" id="counts"></div>
    <p class="warn" id="warn" hidden></p>
    <div class="row"><button class="btn primary" id="startBtn">Commencer le quiz</button></div>
  </section>

  <div id="quizArea" hidden>
    <div class="meta"><span id="progressTxt"></span><span class="score" id="scoreTxt"></span></div>
    <div class="bar" aria-hidden="true"><i id="progressBar" style="width:0"></i></div>
    <main id="stage"></main>
  </div>
  <p class="foot">Les questions sont tirées au hasard à chaque nouveau quiz. Touches 1–4 pour répondre, Entrée pour continuer.</p>
</div>

<script>
/* ---------- helpers ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const VOW=/^[aeiouhéèêàâîôûœ]/i;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const mark=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<u>$1</u>");

/* ---------- Q4 : conjugaison ---------- */
const VERBS={
  regarder:{c:["un film","la télévision"]},
  jouer:{c:["au football","aux échecs"]},
  visiter:{c:["le musée","le château de Versailles"]},
  organiser:{c:["une fête","un concours de dessin"]},
  préparer:{c:["le dîner","un gâteau au chocolat"]},
  écouter:{c:["de la musique"]},
  arriver:{c:["à l'école en avance"],aux:1},
  rester:{c:["à la maison"],aux:1},
  finir:{g:"ir",c:["les devoirs"]},
  choisir:{g:"ir",c:["un cadeau"]},
  faire:{pr:["fais","fais","fait","faisons","faites","font"],pp:"fait",fut:"fer",c:["une promenade","du vélo"]},
  lire:{pr:["lis","lis","lit","lisons","lisez","lisent"],pp:"lu",c:["un roman","des bandes dessinées"]},
  écrire:{pr:["écris","écris","écrit","écrivons","écrivez","écrivent"],pp:"écrit",c:["une lettre","un poème"]},
  prendre:{pr:["prends","prends","prend","prenons","prenez","prennent"],pp:"pris",c:["le bus","le train"]},
  aller:{pr:["vais","vas","va","allons","allez","vont"],pp:"allé",fut:"ir",aux:1,imp:"va",c:["au marché","à la plage"]},
  venir:{pr:["viens","viens","vient","venons","venez","viennent"],pp:"venu",fut:"viendr",aux:1,c:["à la fête"]},
  sortir:{pr:["sors","sors","sort","sortons","sortez","sortent"],pp:"sorti",aux:1,c:["avec des amis"]},
  partir:{pr:["pars","pars","part","partons","partez","partent"],pp:"parti",aux:1,c:["en vacances"]},
  voir:{pr:["vois","vois","voit","voyons","voyez","voient"],pp:"vu",fut:"verr",c:["un film au cinéma"]}
};
const ETRE=["suis","es","est","sommes","êtes","sont"], AVOIR=["ai","as","a","avons","avez","ont"];
const pres=(inf,p)=>{const v=VERBS[inf];if(v.pr)return v.pr[p];
  if(v.g==="ir")return inf.slice(0,-2)+["is","is","it","issons","issez","issent"][p];
  return inf.slice(0,-2)+["e","es","e","ons","ez","ent"][p]};
const part=inf=>{const v=VERBS[inf];if(v.pp)return v.pp;return v.g==="ir"?inf.slice(0,-1):inf.slice(0,-2)+"é"};
const CONJ={
  pres:(inf,p)=>pres(inf,p),
  imp:(inf,p)=>pres(inf,3).replace(/ons$/,"")+["ais","ais","ait","ions","iez","aient"][p],
  fs:(inf,p)=>{const v=VERBS[inf];const st=v.fut||(inf.endsWith("re")?inf.slice(0,-1):inf);return st+["ai","as","a","ons","ez","ont"][p]},
  fp:(inf,p)=>VERBS.aller.pr[p]+" "+inf,
  pc:(inf,p,g)=>{const v=VERBS[inf];let pp=part(inf);if(v.aux){if(g==="f")pp+="e";if(p>=3)pp+="s"}return (v.aux?ETRE[p]:AVOIR[p])+" "+pp}
};
const imper=(inf,p)=>{const v=VERBS[inf];if(p===1){if(v.imp)return v.imp;if(v.pr||v.g==="ir")return pres(inf,1);return pres(inf,1).slice(0,-1)}return pres(inf,p)};
const TENSES={
  pres:{name:"présent",m:["D'habitude,","Chaque samedi,","Tous les jours,","En général,"],why:"Habitude ou action actuelle → présent."},
  pc:{name:"passé composé",m:["Hier,","Dimanche dernier,","L'été dernier,","La semaine dernière,"],why:"Action terminée dans le passé → passé composé (avoir / être + participe passé)."},
  imp:{name:"imparfait",m:["Autrefois,","À cette époque-là,","Quand j'étais enfant,"],why:"Habitude dans le passé → imparfait : radical de « nous » au présent + -ais, -ais, -ait, -ions, -iez, -aient."},
  fs:{name:"futur simple",m:["L'année prochaine,","Dans dix ans,","Le mois prochain,","Un jour,"],why:"Action future → futur simple : infinitif + -ai, -as, -a, -ons, -ez, -ont."},
  fp:{name:"futur proche",m:["Ce soir,","Dans cinq minutes,","Tout à l'heure,"],why:"Futur immédiat → futur proche : aller au présent + infinitif."}
};
const SUBJ=[{s:"je",p:0},{s:"tu",p:1},{s:"Nadia",p:2,g:"f"},{s:"Paul",p:2,g:"m"},{s:"ma sœur",p:2,g:"f"},{s:"mon frère",p:2,g:"m"},{s:"nous",p:3},{s:"vous",p:4},{s:"mes amis",p:5,g:"m"},{s:"mes cousines",p:5,g:"f"}];
const withJe=f=>(VOW.test(f)?"j'":"je ")+f;
const IMPER=[["finir",4,"vos devoirs avant le dîner !"],["regarder",1,"le tableau, s'il te plaît !"],["prendre",3,"le bus ce matin !"],["écrire",1,"une lettre à ta grand-mère !"],["faire",4,"attention en classe !"],["aller",3,"au parc cet après-midi !"],["lire",4,"le texte à haute voix !"],["choisir",1,"un livre pour le voyage !"],["écouter",4,"bien le professeur !"],["rester",4,"attentifs pendant l'activité !"],["préparer",1,"ton sac pour demain !"],["venir",1,"ici tout de suite !"]];
const PRON=["je","tu","il","nous","vous","ils"];

function genTemps(lvl){
  const easy=lvl==="easy";
  if(Math.random()<(easy?0.2:0.25)){
    const list=easy?IMPER.filter(x=>x[0]!=="rester"&&x[0]!=="venir"):IMPER;
    const [inf,p,rest]=rnd(list);
    const ans=cap(imper(inf,p));
    const wrong=[cap(PRON[p]+" "+pres(inf,p)),cap(CONJ.fs(inf,p)),cap(CONJ.imp(inf,p)),cap(imper(inf,p===1?4:1))];
    return {sentence:"___ "+rest,hint:"("+inf+")",ans,opts:pick(ans,wrong),
      expl:"Ordre ou conseil → impératif, sans sujet."+(p===1&&!VERBS[inf].pr&&VERBS[inf].g!=="ir"?" Avec « tu », les verbes en -er perdent le -s.":"")+" "+cap(imper(inf,p))+" "+rest};
  }
  // Facile : présent, passé composé (avoir), futurs ; Difficile : + imparfait, verbes avec être, irréguliers plus souvent
  const tkeys=easy?["pres","pc","fs","fp"]:["pres","pc","pc","imp","imp","fs","fp"];
  const tk=rnd(tkeys), T=TENSES[tk];
  const allV=Object.keys(VERBS);
  const hardV=allV.filter(k=>VERBS[k].aux||VERBS[k].pr);
  const inf=easy?rnd(allV.filter(k=>!VERBS[k].aux)):rnd(Math.random()<.7?hardV:allV), v=VERBS[inf];
  let pool=SUBJ; if(v.aux) pool=SUBJ.filter(s=>s.g);
  const S=rnd(pool);
  const f=k=>{const x=CONJ[k](inf,S.p,S.g);return S.p===0?withJe(x):x};
  const ans=f(tk);
  const others=(easy?["pres","pc","fs","fp"]:Object.keys(TENSES)).filter(k=>k!==tk&&!(tk==="fs"&&k==="fp")&&!(tk==="fp"&&k==="fs"));
  // Difficile : ajoute un piège d'accord / d'auxiliaire
  let trap=null;
  if(!easy&&tk==="pc"){const pp=part(inf);const J=x=>S.p===0?withJe(x):x;
    trap=v.aux?[AVOIR[S.p]+" "+pp,ETRE[S.p]+" "+(S.g==="f"?pp:pp+"e")+(S.p>=3?"s":""),f("imp")].map(J)
              :[ETRE[S.p]+" "+pp,f("imp"),f("fs")].map(x=>x.startsWith("j'")||x.startsWith("je ")?x:J(x));}
  const wrong=trap||others.map(f);
  if(new Set(wrong.filter(x=>x!==ans)).size<3) wrong.push(S.p===0?"je "+inf:inf, CONJ.imp(inf,S.p));
  let marker=rnd(T.m);
  const comp=rnd(v.c);
  const sentence=marker+" "+(S.p===0?"___":S.s+" ___")+" "+comp+".";
  const full=marker+" "+(S.p===0?ans:S.s+" "+ans)+" "+comp+".";
  let extra="";
  if(tk==="pc"&&v.aux) extra=" « "+inf+" » se conjugue avec être : le participe s'accorde avec le sujet.";
  return {sentence,hint:"("+inf+")",ans,opts:pick(ans,wrong),expl:T.why+extra+" → "+full};
}
function pick(ans,wrong){const w=shuffle([...new Set(wrong)].filter(x=>x!==ans)).slice(0,3);return shuffle([ans,...w])}

/* ---------- Q5 : adjectifs démonstratifs ---------- */
const DEMO=[
 ["J'aime beaucoup ___ veste grise.","f"],["___ garçons jouent près de la fenêtre.","p"],["Nous allons acheter ___ ordinateur demain.","mv"],
 ["Regarde ___ oiseaux dans le ciel !","p"],["___ histoire est très amusante.","f"],["Elle veut visiter ___ château ancien.","m"],
 ["___ chaussures sont trop grandes pour moi.","p"],["___ arbre est très vieux.","mv"],["___ hôtel est près de la plage.","mv"],
 ["___ homme est mon professeur de français.","mv"],["Je n'aime pas ___ film.","m"],["___ école a une grande bibliothèque.","f"],
 ["Tu connais ___ fille ?","f"],["___ livre est très intéressant.","m"],["___ enfants sont très sages.","p"],
 ["___ hiver, nous allons à la montagne.","mv"],["___ été, il fait très chaud à Doha.","mv"],["___ saison est ma préférée.","f"],
 ["___ année, je suis en classe de neuvième.","f"],["___ appartement est moderne.","mv"],["___ matin, je prends le bus.","m"],
 ["___ croissants sont délicieux.","p"],["Qui a écrit ___ lettre ?","f"],["___ ami s'appelle Karim.","mv"],

/* ---------- Q9 : adjectifs possessifs ---------- */
const POSS=[["mon","ma","mes"],["ton","ta","tes"],["son","sa","ses"],["notre","notre","nos"],["votre","votre","vos"],["leur","leur","leurs"]];
const NEIGH=[["ton"],["mon"],["leur","leurs"],["vos","votre"],["nos","notre"],["son","ses"]];
const OWNERS=[{s:"Je",p:0},{s:"Tu",p:1},{s:"Claire",p:2},{s:"Rohan",p:2},{s:"Nous",p:3},{s:"Vous",p:4},{s:"Les enfants",p:5},{s:"Mes cousins",p:5}];
const OBJ=[["parapluie","m"],["lunettes","p"],["activité","f",1],["trousse","f"],["cahier","m"],["dictionnaires","p"],["clés","p"],["montre","f"],["sac","m"],["écharpe","f",1],["ordinateur","m",1],["affiche","f",1],["présentation","f"],["photos","p"],["histoire","f",1]];
const PEOPLE=[["grands-parents","p"],["tante","f"],["oncle","m",1],["amie","f",1],["cousins","p"],["mère","f"],["père","m"],["amis","p"]];
const OBJ_V=[["chercher",""],["ranger",""],["oublier"," à la maison"],["apporter"," à l'école"]];
const PPL_V=[["aimer beaucoup",""],["inviter"," à la fête"],["écouter",""],["aider"," le week-end"]];
const erConj=(inf,p)=>{const [verb,...adv]=inf.split(" ");let st=verb.slice(0,-2);if(verb==="ranger"&&p===3)st+="e";
  const f=st+["e","es","e","ons","ez","ent"][p];return [f,...adv].join(" ")};
function genPoss(lvl){
  const easy=lvl==="easy";
  // Facile : pas de piège « mon amie » ; Difficile : pièges voyelle + leur / leurs, notre / nos plus souvent
  const O=easy?rnd(OWNERS):rnd(Math.random()<.5?OWNERS.filter(o=>o.p>=3):OWNERS.filter(o=>o.p<3));
  const people=Math.random()<.4;
  let list=people?PEOPLE:OBJ;
  if(easy) list=list.filter(x=>!(x[1]==="f"&&x[2]));
  else if(O.p<3&&Math.random()<.6) list=list.filter(x=>x[1]==="f"&&x[2]);
  const [n,g,v]=rnd(list); const [inf,tail]=rnd(people?PPL_V:OBJ_V);
  const row=POSS[O.p]; let ans; let why;
  if(g==="p"){ans=row[2];why="nom pluriel"}
  else if(g==="f"&&v&&O.p<3){ans=row[0];why="nom féminin qui commence par une voyelle : on dit "+row[0]+" (et non "+row[1]+") pour éviter le hiatus"}
  else {ans=g==="m"?row[0]:row[1];why=g==="m"?"nom masculin singulier":"nom féminin singulier"}
  let verb=erConj(inf,O.p); let subj=O.s;
  if(O.p===0&&VOW.test(verb)){subj="J'";verb=verb}else subj=O.s+" ";
  const sentence=subj+verb+" ___ "+n+tail+".";
  const wrong=[...row,...NEIGH[O.p]];
  if(ans===row[0]&&g==="f") wrong.unshift(row[1]);
  const opts=[...new Set(wrong)].filter(x=>x!==ans);
  const w=(g==="f"&&v&&O.p<3)?[row[1],...shuffle(opts.filter(x=>x!==row[1]))].slice(0,3):shuffle(opts).slice(0,3);
  const owner=["je","tu","il / elle","nous","vous","ils / elles"][O.p];
  return {sentence,ans,opts:shuffle([ans,...w]),expl:"Possesseur : « "+owner+" » ; "+why+". → "+sentence.replace("___",ans)};
}

];

/* ---------- état ---------- */
const LVL={easy:"Facile",hard:"Difficile"};
let settings={cats:CATS.map(c=>c.id),count:15,level:null};
try{const s=JSON.parse(localStorage.getItem("cahier-settings")||"null");if(s&&Array.isArray(s.cats)&&s.cats.length)settings=Object.assign(settings,s)}catch(e){}
let quiz=[],idx=0,score=0,answered=false;

function build(){
  const lvl=settings.level;
  const chosen=CATS.filter(c=>settings.cats.includes(c.id));
  const poolOf=c=>c.pool.filter(it=>it.L===lvl);
  const decks={};chosen.forEach(c=>{if(c.pool)decks[c.id]=shuffle(poolOf(c))});
  const order=[];for(let i=0;i<settings.count;i++)order.push(chosen[i%chosen.length]);
  const seen=new Set();
  quiz=shuffle(order).map(c=>{
    let q,tries=0;
    do{ if(c.pool){if(!decks[c.id].length)decks[c.id]=shuffle(poolOf(c));q=c.gen(decks[c.id].pop(),lvl)}else q=c.gen(lvl); tries++ }
    while(seen.has(q.sentence)&&tries<25);
    seen.add(q.sentence);
    return Object.assign(q,{cat:c,picked:null});
  });
  idx=0;score=0;answered=false;render();
}

const stage=document.getElementById("stage");
function renderSentence(q){
  let html=mark(q.sentence);
  if(html.includes("___")) html=html.replace("___",answered?'<span class="blank filled">'+esc(q.ans)+'</span>':'<span class="blank" aria-label="blanc">&nbsp;</span>');
  return html;
}
function render(){
  const total=quiz.length;
  document.getElementById("progressTxt").innerHTML=(idx<total?"Question "+(idx+1)+" sur "+total:"Terminé")+'<span class="lvl">'+LVL[settings.level]+'</span>';
  document.getElementById("scoreTxt").innerHTML="Score <b>"+score+"</b> / "+Math.min(idx+(answered?1:0),total);
  document.getElementById("progressBar").style.width=(100*(idx+(answered?1:0))/total)+"%";
  if(idx>=total){renderResults();return}
  const q=quiz[idx];
  let h='<article class="sheet"><span class="qnum">'+(idx+1)+'.</span>'+
    '<span class="tag">'+q.cat.q+' · '+q.cat.name+'</span>'+
    '<p class="instr">'+esc(q.cat.instr)+'</p>'+
    '<p class="sentence">'+renderSentence(q)+'</p>'+
    (q.hint?'<p class="hint">'+esc(q.hint)+'</p>':'')+
    '<div class="opts'+(q.long?' long':'')+'" role="group" aria-label="Réponses">';
  q.opts.forEach((o,i)=>{
    let cls="opt";
    if(answered){if(o===q.ans)cls+=" ok";else if(o===q.picked)cls+=" bad";else cls+=" dim"}
    h+='<button class="'+cls+'" data-i="'+i+'" '+(answered?"disabled":"")+'><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>';
  });
  h+='</div>';
  if(answered){
    const ok=q.picked===q.ans;
    h+='<div class="fb'+(ok?"":" no")+'" role="status"><strong>'+(ok?"Bravo, c'est juste !":"Pas tout à fait. Réponse : "+esc(q.ans))+'</strong><p>'+esc(q.expl)+'</p></div>'+
       '<div class="next"><button class="btn primary" id="nextBtn">'+(idx+1<total?"Question suivante →":"Voir mes résultats")+'</button></div>';
  }
  h+='</article>';
  stage.innerHTML=h;
  stage.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  const nb=document.getElementById("nextBtn");if(nb){nb.addEventListener("click",next);nb.focus({preventScroll:true})}
}
function choose(i){if(answered)return;const q=quiz[idx];q.picked=q.opts[i];if(q.picked===q.ans)score++;answered=true;render()}
function next(){if(!answered)return;answered=false;idx++;render();window.scrollTo({top:0,behavior:"smooth"})}

function renderResults(){
  const total=quiz.length, pct=Math.round(100*score/total), easy=settings.level==="easy";
  const msg=pct>=90?(easy?"Excellent ! Essayez maintenant le niveau Difficile.":"Excellent travail, vous êtes prêt(e) pour l'examen !"):pct>=70?"Très bien. Revoyez les erreurs ci-dessous.":pct>=50?"Pas mal. Encore un peu de pratique.":"Continuez à réviser, vous allez progresser.";
  let h='<article class="sheet"><span class="qnum">✓</span><span class="tag">Résultats · '+LVL[settings.level]+'</span>'+
    '<p class="big">'+score+' <small>/ '+total+'</small></p><p class="instr">'+msg+'</p><div class="cats">';
  CATS.forEach(c=>{const qs=quiz.filter(q=>q.cat===c);if(!qs.length)return;const ok=qs.filter(q=>q.picked===q.ans).length;const p=ok/qs.length;
    h+='<div class="cat"><span>'+c.q+' · '+c.name+'</span><span class="bar"><i class="'+(p<.6?"low":"")+'" style="width:'+(p*100)+'%"></i></span><span>'+ok+' / '+qs.length+'</span></div>'});
  h+='</div><div class="row"><button class="btn primary" id="againBtn">Nouveau quiz ('+LVL[settings.level]+')</button>'+
     (easy&&pct>=70?'<button class="btn" id="upBtn">Passer au niveau Difficile</button>':'')+
     '<button class="btn" id="setBtn">Changer de niveau</button></div>';
  const wrong=quiz.filter(q=>q.picked!==q.ans);
  if(wrong.length){
    h+='<div class="review"><h3>À revoir ('+wrong.length+')</h3>';
    wrong.forEach(q=>{
      h+='<div class="rv"><span class="tag">'+q.cat.q+' · '+q.cat.name+'</span><span class="q">'+mark(q.sentence)+(q.hint?' <em>'+esc(q.hint)+'</em>':'')+'</span>'+
         '<span class="y">Votre réponse : '+esc(q.picked)+'</span><span class="c">Bonne réponse : '+esc(q.ans)+'</span><span>'+esc(q.expl)+'</span></div>';
    });
    h+='</div>';
  }
  h+='</article>';
  stage.innerHTML=h;
  document.getElementById("againBtn").addEventListener("click",build);
  document.getElementById("setBtn").addEventListener("click",showStart);
  const up=document.getElementById("upBtn");if(up)up.addEventListener("click",()=>{settings.level="hard";save();document.getElementById("level-hard").checked=true;build()});
}

/* ---------- écran de départ ---------- */
const chipsEl=document.getElementById("chips"),countsEl=document.getElementById("counts"),setEl=document.getElementById("settings"),tog=document.getElementById("toggleSettings"),area=document.getElementById("quizArea");
CATS.forEach(c=>{chipsEl.insertAdjacentHTML("beforeend",'<label class="chip"><input type="checkbox" id="cat-'+c.id+'" value="'+c.id+'" '+(settings.cats.includes(c.id)?"checked":"")+'><span><b>'+c.q+'</b>'+c.name+'</span></label>')});
[10,15,20,30].forEach(n=>{countsEl.insertAdjacentHTML("beforeend",'<label class="count"><input type="radio" name="count" id="count-'+n+'" value="'+n+'" '+(settings.count===n?"checked":"")+'><span>'+n+'</span></label>')});
if(settings.level){const r=document.getElementById("level-"+settings.level);if(r)r.checked=true}
const save=()=>{try{localStorage.setItem("cahier-settings",JSON.stringify(settings))}catch(e){}};
function showStart(){setEl.hidden=false;area.hidden=true;tog.hidden=true;window.scrollTo({top:0,behavior:"smooth"})}
function showQuiz(){setEl.hidden=true;area.hidden=false;tog.hidden=false}
tog.addEventListener("click",showStart);
document.getElementById("startBtn").addEventListener("click",()=>{
  const warn=document.getElementById("warn");
  const lv=document.querySelector('input[name="level"]:checked');
  const cats=[...chipsEl.querySelectorAll("input:checked")].map(i=>i.value);
  if(!lv){warn.textContent="Choisissez d'abord un niveau : Facile ou Difficile.";warn.hidden=false;return}
  if(!cats.length){warn.textContent="Choisissez au moins une section.";warn.hidden=false;return}
  warn.hidden=true;
  settings={cats,count:+countsEl.querySelector("input:checked").value,level:lv.value};
  save();showQuiz();build();window.scrollTo({top:0});
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input")||area.hidden)return;
  if(!answered&&/^[1-4]$/.test(e.key)&&idx<quiz.length){const b=stage.querySelector('.opt[data-i="'+(+e.key-1)+'"]');if(b)b.click()}
  else if(answered&&(e.key==="Enter"||e.key==="ArrowRight")&&document.activeElement.id!=="nextBtn"){e.preventDefault();next()}
});
</script>
</body>
</html>
