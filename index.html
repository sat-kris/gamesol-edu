<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Exam practice quiz games by class and subject">
<title>Gamesol Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap">
<style>
:root{
  --paper:#F8F9FD; --sheet:#FFFFFF; --ink:#1D2340; --ink-soft:#5A6082;
  --line:#E3E6F6; --line-strong:#C3C9EE; --margin:#D8454F;
  --accent:#2446C8; --accent-soft:#E6EBFC; --series2:#C2410C;
  --good:#1D7F55; --good-soft:#E3F4EC; --bad:#BF3440; --bad-soft:#FBE7E9;
  --shadow:0 1px 2px rgba(29,35,64,.06),0 8px 28px rgba(29,35,64,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#12152A; --sheet:#1A1E38; --ink:#E7E9F7; --ink-soft:#A3A8C8;
  --line:#242A4C; --line-strong:#353D6E; --margin:#E8656E;
  --accent:#8EA6FF; --accent-soft:#252E5C; --series2:#FB923C;
  --good:#5FD19C; --good-soft:#18362C; --bad:#FF8A93; --bad-soft:#3E1C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#12152A; --sheet:#1A1E38; --ink:#E7E9F7; --ink-soft:#A3A8C8;
  --line:#242A4C; --line-strong:#353D6E; --margin:#E8656E;
  --accent:#8EA6FF; --accent-soft:#252E5C; --series2:#FB923C;
  --good:#5FD19C; --good-soft:#18362C; --bad:#FF8A93; --bad-soft:#3E1C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0}
.sub{margin:4px 0 0;color:var(--ink-soft);font-size:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08);color:var(--sheet)}
.btn.small{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--sheet);border:1px solid var(--line-strong);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0;padding-bottom:0}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.field input{font:inherit;font-weight:400;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink)}
.note,.muted{margin:0;font-size:13.5px;color:var(--ink-soft)}
.choice{position:relative;display:flex}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice>span{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--sheet)}
.choice>span:hover{border-color:var(--accent)}
.choice input:checked+span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.choice strong{font-size:16px}
.choice small{font-size:13px;color:var(--ink-soft)}
.choice .big{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:22px;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);cursor:pointer;font-size:14px}
.pill input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.soon{font-size:13px;color:var(--ink-soft)}
.soon b{font-weight:700}
.topics{display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.topic{display:grid;grid-template-columns:auto 4.2em 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.topic:last-child{border-bottom:0}
.topic:hover{background:var(--accent-soft)}
.topic input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.topic .ref{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.topic .cnt{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.warn{color:var(--bad);font-size:14px;margin:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tagl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-left:6px;border:1px solid var(--line-strong);color:var(--ink-soft)}
#quizArea{display:flex;flex-direction:column;gap:18px}
.sheet{position:relative;background:var(--sheet);border-radius:4px 12px 12px 4px;box-shadow:var(--shadow);padding:26px 22px 22px 58px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line-strong) 31px 32px),repeating-linear-gradient(to bottom,transparent 0 7px,var(--line) 7px 8px);background-position:0 14px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:var(--margin);opacity:.75}
.qnum{position:absolute;left:0;width:40px;top:28px;text-align:center;font-family:"Young Serif",Georgia,serif;color:var(--margin);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:4px}
.qtext{font-family:"Young Serif",Georgia,serif;font-size:clamp(19px,3.3vw,23px);line-height:1.5;margin:14px 0 6px;text-wrap:pretty}
.graph{background:var(--sheet);border:1px solid var(--line-strong);border-radius:8px;padding:8px;margin:12px 0 4px;max-width:480px}
.graph svg{display:block;width:100%;height:auto}
.graph text{fill:var(--ink-soft);font-size:12px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.graph .ax{stroke:var(--ink-soft);stroke-width:1.2}
.graph .gl{stroke:var(--line);stroke-width:1}
.graph .l0{stroke:var(--accent);stroke-width:2.5;fill:none}
.graph .l1{stroke:var(--series2);stroke-width:2.5;fill:none}
.graph .fillA{fill:var(--accent-soft)}
.graph .guide{stroke:var(--ink-soft);stroke-dasharray:4 3;stroke-width:1}
.graph .pt{fill:var(--accent);stroke:var(--sheet);stroke-width:2}
.graph .lbl{font-weight:700;font-size:14px}
.graph .lbl0{fill:var(--accent)} .graph .lbl1{fill:var(--series2)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt kbd{font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:4px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok kbd{border-color:var(--good);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad kbd{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:14px 16px;border-radius:8px;border-left:4px solid var(--good);background:var(--good-soft);display:flex;flex-direction:column;gap:4px}
.fb.no{border-left-color:var(--bad);background:var(--bad-soft)}
.fb p{margin:0;font-size:15px}
.next{display:flex;justify-content:flex-end;margin-top:16px}
.score{font-family:"Young Serif",Georgia,serif;font-size:52px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--ink-soft)}
.cats{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.cat{display:grid;grid-template-columns:minmax(0,14em) 1fr 3.5em;gap:10px;align-items:center;font-size:14px}
.cat .bar{height:8px}
.cat .bar i.low{background:var(--bad)}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.review h3,.board h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 0}
.rv{padding:12px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--sheet);font-size:15px;display:flex;flex-direction:column;gap:4px}
.rv .y{color:var(--bad)} .rv .c{color:var(--good)}
.board{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rank{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent)}
.rank b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:34px;line-height:1;color:var(--accent)}
.lb{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.lb th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line-strong)}
.lb td{padding:8px;border-bottom:1px solid var(--line)}
.lb .num{text-align:right}
.lb tr.me td{background:var(--accent-soft);font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.foot{font-size:13px;color:var(--ink-soft);text-align:center}
.error{padding:16px;border-radius:10px;background:var(--bad-soft);color:var(--ink)}
@media (max-width:560px){
  .fields,.grid.two{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .sheet{padding:22px 16px 18px 46px}.sheet::before{left:30px}.qnum{width:30px;font-size:13px}
  .topic{grid-template-columns:auto 1fr;row-gap:2px}.topic .ref{grid-column:2}.topic .cnt{grid-column:2}
  .topic .ref{order:-1}
  .cat{grid-template-columns:1fr 3em}.cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="appName">Gamesol Edu</h1>
      <p class="sub" id="tagline">Exam practice games</p>
    </div>
    <button class="btn" id="homeBtn" hidden>← Change topics</button>
  </header>

  <section class="panel" id="home">
    <p class="muted" id="loading">Loading classes…</p>
  </section>

  <div id="quizArea" hidden>
    <div class="meta"><span id="progressTxt"></span><span id="scoreTxt"></span></div>
    <div class="bar" aria-hidden="true"><i id="progressBar" style="width:0"></i></div>
    <main id="stage"></main>
  </div>
  <p class="foot">New questions every time: numbers change and answers are shuffled. Press 1–4 to answer and Enter to continue.</p>
</div>

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LVL={easy:"Easy",hard:"Hard"};

let CONFIG=null, API="", ONLINE=false;
let player=Object.assign({name:"",section:""},store.get("gamesol-player")||{});
let sel=Object.assign({cls:null,subject:null,chapter:null,topics:null,level:null,count:15},store.get("gamesol-sel")||{});
let BANK=null;
const bankCache={};

/* ---------- load config ---------- */
async function boot(){
  try{
    const r=await fetch("edu-kids-config.json",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    CONFIG=await r.json();
  }catch(e){
    $("home").innerHTML='<div class="error"><strong>Could not load edu-kids-config.json.</strong><br>Open this page from GitHub Pages (or a local web server). Opening the file directly from your computer does not allow it to read the config file.</div>';
    return;
  }
  if(CONFIG.appName){$("appName").textContent=CONFIG.appName;document.title=CONFIG.appName}
  if(CONFIG.tagline)$("tagline").textContent=CONFIG.tagline;
  API=String(CONFIG.leaderboard&&CONFIG.leaderboard.scriptUrl||"").trim();
  ONLINE=/^https:\/\/script\.google(usercontent)?\.com\//.test(API);
  renderHome();
}
const ongoing=list=>(list||[]).filter(x=>String(x.status||"").toLowerCase()==="ongoing");
const notOngoing=list=>(list||[]).filter(x=>String(x.status||"").toLowerCase()!=="ongoing");

/* ---------- home / selection ---------- */
function renderHome(){
  const classes=ongoing(CONFIG.classes);
  if(!classes.find(c=>c.id===sel.cls)) sel.cls=classes.length===1?classes[0].id:null;
  const cls=classes.find(c=>c.id===sel.cls);
  const subjects=cls?ongoing(cls.subjects):[];
  if(!subjects.find(s=>s.id===sel.subject)) sel.subject=subjects.length===1?subjects[0].id:null;
  const subj=subjects.find(s=>s.id===sel.subject);
  const chapters=subj&&!subj.link?ongoing(subj.chapters):[];
  if(!chapters.find(c=>c.id===sel.chapter)) sel.chapter=chapters.length?chapters[0].id:null;
  const chap=chapters.find(c=>c.id===sel.chapter);

  let h="";
  if(ONLINE){
    h+='<div class="step"><h2>Who is playing?</h2><div class="fields">'+
      '<label class="field" for="pName">Name<input id="pName" type="text" maxlength="40" autocomplete="name" placeholder="e.g. Aisha Khan" value="'+esc(player.name)+'"></label>'+
      '<label class="field" for="pSection">Section<input id="pSection" type="text" maxlength="12" placeholder="e.g. B" value="'+esc(player.section)+'"></label></div>'+
      '<p class="note">Your best score appears on the class leaderboard. Use the same name every time.</p></div>';
  }
  h+='<div class="step"><h2>Class</h2><div class="pills">'+
    (classes.length?classes.map(c=>'<label class="pill"><input type="radio" name="cls" value="'+esc(c.id)+'"'+(c.id===sel.cls?" checked":"")+'><span>'+esc(c.name)+'</span></label>').join(""):'<p class="muted">No class is marked as ongoing in the config file.</p>')+
    '</div>'+soonLine(notOngoing(CONFIG.classes))+'</div>';
  if(cls){
    h+='<div class="step"><h2>Subject</h2><div class="grid">'+
      (subjects.length?subjects.map(s=>'<label class="choice"><input type="radio" name="subject" value="'+esc(s.id)+'"'+(s.id===sel.subject?" checked":"")+'><span><strong>'+esc(s.name)+'</strong><small>'+esc(s.link?(s.note||"Opens its own game"):(ongoing(s.chapters).length+" chapter"+(ongoing(s.chapters).length===1?"":"s")+" open"))+'</small></span></label>').join(""):'<p class="muted">No subject is ongoing for this class yet.</p>')+
      '</div>'+soonLine(notOngoing(cls.subjects))+'</div>';
  }
  if(subj&&subj.link){
    h+='<div class="step"><h2>'+esc(subj.name)+'</h2><p class="muted">'+esc(subj.note||"")+'</p><div class="row"><a class="btn primary" href="'+esc(subj.link)+'">Open '+esc(subj.name)+' game →</a></div></div>';
  }else if(subj){
    h+='<div class="step"><h2>Chapter</h2><div class="grid two">'+
      chapters.map(c=>'<label class="choice"><input type="radio" name="chapter" value="'+esc(c.id)+'"'+(c.id===sel.chapter?" checked":"")+'><span><strong>'+esc(c.name)+'</strong></span></label>').join("")+
      '</div>'+soonLine(notOngoing(subj.chapters))+'</div>';
    h+='<div class="step" id="topicStep"><h2>Topics</h2><p class="muted">Loading topics…</p></div>';
  }
  $("home").innerHTML=h;
  $("home").querySelectorAll('input[name="cls"]').forEach(i=>i.addEventListener("change",()=>{sel.cls=i.value;sel.subject=null;keepNames();renderHome()}));
  $("home").querySelectorAll('input[name="subject"]').forEach(i=>i.addEventListener("change",()=>{sel.subject=i.value;sel.chapter=null;sel.topics=null;keepNames();renderHome()}));
  $("home").querySelectorAll('input[name="chapter"]').forEach(i=>i.addEventListener("change",()=>{sel.chapter=i.value;sel.topics=null;keepNames();renderHome()}));
  if(chap) loadBank(chap).then(b=>renderTopics(b,cls,subj,chap)).catch(()=>{$("topicStep").innerHTML='<h2>Topics</h2><p class="warn">Could not load the question bank "'+esc(chap.bank)+'". Check the path in edu-kids-config.json.</p>'});
}
function soonLine(list){return list.length?'<p class="soon">Coming soon: '+list.map(x=>'<b>'+esc(x.name)+'</b>').join(", ")+'</p>':""}
function keepNames(){if($("pName")){player.name=$("pName").value.replace(/\s+/g," ").trim();player.section=$("pSection").value.replace(/\s+/g,"").toUpperCase()}}
async function loadBank(chap){
  if(bankCache[chap.bank]) return bankCache[chap.bank];
  const r=await fetch(chap.bank,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
  return bankCache[chap.bank]=await r.json();
}
function renderTopics(bank,cls,subj,chap){
  BANK=bank;
  const ids=bank.topics.map(t=>t.id);
  if(!Array.isArray(sel.topics)||!sel.topics.some(t=>ids.includes(t))) sel.topics=ids.slice();
  const cnt=(t,l)=>bank.questions.filter(q=>q.topic===t&&q.level===l).length;
  let h='<div class="row" style="justify-content:space-between"><h2>Topics ('+bank.topics.length+')</h2><div class="row"><button class="btn small" id="allT">Select all</button><button class="btn small" id="noneT">Clear</button></div></div>'+
    '<div class="topics">'+bank.topics.map(t=>'<label class="topic" for="t-'+esc(t.id)+'"><input type="checkbox" id="t-'+esc(t.id)+'" value="'+esc(t.id)+'"'+(sel.topics.includes(t.id)?" checked":"")+'><span class="ref">'+esc(t.ref||"")+'</span><span>'+esc(t.name)+'</span><span class="cnt">'+cnt(t.id,"easy")+' easy · '+cnt(t.id,"hard")+' hard</span></label>').join("")+'</div>'+
    '<p class="note">Source: '+esc(bank.source||bank.chapter)+'. Numerical questions use new numbers every time.</p>';
  h+='</div><div class="step"><h2>Level</h2><div class="grid two">'+
    '<label class="choice"><input type="radio" name="level" value="easy"'+(sel.level==="easy"?" checked":"")+'><span><span class="big">Easy</span><small>Definitions, units, reading simple graphs and one-step calculations.</small></span></label>'+
    '<label class="choice"><input type="radio" name="level" value="hard"'+(sel.level==="hard"?" checked":"")+'><span><span class="big">Hard</span><small>Exam-style reasoning, unit conversion, multi-step problems and graph analysis.</small></span></label>'+
    '</div></div><div class="step"><h2>Number of questions</h2><div class="pills">'+
    [10,15,20,30].map(n=>'<label class="pill"><input type="radio" name="count" value="'+n+'"'+(sel.count===n?" checked":"")+'><span>'+n+'</span></label>').join("")+
    '</div><p class="warn" id="warn" hidden></p><div class="row"><button class="btn primary" id="startBtn">Start quiz</button>'+(ONLINE?'<button class="btn" id="boardBtn">Leaderboard</button>':'')+'</div><div id="startBoard" hidden></div>';
  const step=$("topicStep");step.innerHTML=h;
  const boxes=()=>[...step.querySelectorAll('.topics input')];
  $("allT").addEventListener("click",()=>boxes().forEach(b=>b.checked=true));
  $("noneT").addEventListener("click",()=>boxes().forEach(b=>b.checked=false));
  $("startBtn").addEventListener("click",()=>start(cls,subj,chap,boxes()));
  if(ONLINE)$("boardBtn").addEventListener("click",()=>{const sb=$("startBoard");if(!sb.hidden){sb.hidden=true;return}keepNames();const l=document.querySelector('input[name="level"]:checked');showBoard(sb,cls,subj,l?l.value:"easy")});
}
function start(cls,subj,chap,boxes){
  const warn=$("warn");const say=m=>{warn.textContent=m;warn.hidden=false};
  keepNames();
  if(ONLINE&&player.name.length<2){say("Please enter your name.");$("pName").focus();return}
  const topics=boxes.filter(b=>b.checked).map(b=>b.value);
  if(!topics.length){say("Please choose at least one topic.");return}
  const lv=document.querySelector('input[name="level"]:checked');
  if(!lv){say("Please choose a level: Easy or Hard.");return}
  warn.hidden=true;
  sel.topics=topics;sel.level=lv.value;sel.count=+document.querySelector('input[name="count"]:checked').value;
  store.set("gamesol-sel",sel);store.set("gamesol-player",player);
  CTX={cls,subj,chap};
  build();
}

/* ---------- question generation ---------- */
function evalIn(expr,env){const k=Object.keys(env);return Function(...k,'"use strict";return ('+expr+');')(...k.map(x=>env[x]))}
function pickVar(spec){
  if(Array.isArray(spec)){const [a,b,s]=spec;const n=Math.floor((b-a)/(s||1));return +(a+(s||1)*Math.floor(Math.random()*(n+1))).toFixed(6)}
  if(spec&&spec.of)return rnd(spec.of);
  return spec;
}
function fmt(x,dp){
  if(typeof x!=="number")return String(x);
  const r=Math.round(x*Math.pow(10,dp))/Math.pow(10,dp);
  return (Object.is(r,-0)?0:r).toString().replace(/^-/,"−");
}
function fill(t,env,ansStr){return String(t).replace(/\{(\w+)\}/g,(m,k)=>k==="ans"?ansStr:(k in env?fmt(env[k],2):m))}
function instantiate(item){
  if(item.type!=="calc"){
    return {topic:item.topic,q:item.q,ans:item.a,opts:shuffle([item.a,...item.w]),expl:item.e,graph:item.graph?resolveGraph(item.graph,{}):null,long:[item.a,...item.w].some(o=>o.length>34)};
  }
  const dp=item.dp??2;
  for(let tries=0;tries<60;tries++){
    const env={};
    for(const k in item.vars) env[k]=pickVar(item.vars[k]);
    try{
      for(const k in (item.derive||{})) env[k]=evalIn(item.derive[k],env);
      if(item.where&&!evalIn(item.where,env)) continue;
      const a=evalIn(item.answer,env); if(!isFinite(a)) continue;
      const u=item.unit?" "+item.unit:"";
      const ans=fmt(a,dp)+u;
      let wrong=[...new Set(item.wrong.map(w=>{try{const v=evalIn(w,env);return isFinite(v)?fmt(v,dp)+u:null}catch(e){return null}}).filter(w=>w&&w!==ans))];
      const extra=[a*2,a/2,a*10,a+ (Math.abs(a)>=1?1:0.5),a*1.5];let i=0;
      while(wrong.length<3&&i<extra.length){const w=fmt(extra[i++],dp)+u;if(w!==ans&&!wrong.includes(w))wrong.push(w)}
      wrong=shuffle(wrong).slice(0,3);
      return {topic:item.topic,q:fill(item.q,env,fmt(a,dp)),ans,opts:shuffle([ans,...wrong]),expl:fill(item.e,env,fmt(a,dp)),graph:item.graph?resolveGraph(item.graph,env):null,calc:true};
    }catch(e){continue}
  }
  return null;
}
function resolveGraph(g,env){
  const val=v=>typeof v==="string"?evalIn(v,env):v;
  return Object.assign({},g,{lines:g.lines.map(l=>Object.assign({},l,{pts:l.pts.map(p=>[val(p[0]),val(p[1])])}))});
}
function niceStep(max,target){const raw=max/(target||5);const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function graphSVG(g){
  const W=460,H=250,L=52,R=18,T=16,B=44;
  const all=g.lines.flatMap(l=>l.pts);
  const xmax0=Math.max(...all.map(p=>p[0]));let ymax0=g.ymax||Math.max(...all.map(p=>p[1]));
  const xs=niceStep(xmax0,6),ys=niceStep(ymax0,5);
  const xmax=Math.ceil(xmax0/xs)*xs, ymax=Math.max(ys,Math.ceil(ymax0*1.08/ys)*ys);
  const X=x=>L+(W-L-R)*x/xmax, Y=y=>T+(H-T-B)*(1-y/ymax);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.y+" against "+g.x)+' graph">';
  for(let y=0;y<=ymax+1e-9;y+=ys)s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y)+'" y2="'+Y(y)+'"/><text x="'+(L-7)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+fmt(y,2)+'</text>';
  for(let x=0;x<=xmax+1e-9;x+=xs)s+='<text x="'+X(x)+'" y="'+(H-B+16)+'" text-anchor="middle">'+fmt(x,2)+'</text>';
  if(g.fill&&g.lines[0]){const p=g.lines[0].pts;s+='<path class="fillA" d="M'+X(p[0][0])+' '+Y(0)+p.map(q=>'L'+X(q[0])+' '+Y(q[1])).join("")+'L'+X(p[p.length-1][0])+' '+Y(0)+'Z"/>'}
  s+='<line class="ax" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'"/><line class="ax" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>';
  g.lines.forEach((l,i)=>{
    s+='<polyline class="l'+(i%2)+'" points="'+l.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")+'"/>';
    if(l.label){const p=l.pts[l.pts.length-1];s+='<text class="lbl lbl'+(i%2)+'" x="'+(X(p[0])-8)+'" y="'+(Y(p[1])-8)+'" text-anchor="end">'+esc(l.label)+'</text>'}
  });
  if(g.mark){g.lines[0].pts.forEach(p=>{if(p[0]===0&&p[1]===0)return;
    s+='<line class="guide" x1="'+X(p[0])+'" y1="'+Y(p[1])+'" x2="'+X(p[0])+'" y2="'+(H-B)+'"/><line class="guide" x1="'+L+'" y1="'+Y(p[1])+'" x2="'+X(p[0])+'" y2="'+Y(p[1])+'"/><circle class="pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5"/>'+
      '<text x="'+(X(p[0])+8)+'" y="'+(Y(p[1])-8)+'">('+fmt(p[0],2)+', '+fmt(p[1],2)+')</text>'})}
  s+='<text x="'+((L+W-R)/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(g.x)+'</text>';
  s+='<text transform="translate(14,'+((T+H-B)/2)+') rotate(-90)" text-anchor="middle">'+esc(g.y)+'</text>';
  return s+'</svg>';
}

/* ---------- quiz ---------- */
let CTX=null, quiz=[], idx=0, score=0, answered=false, startedAt=0, attemptId="", submitted=false;
function build(){
  const tmap=Object.fromEntries(BANK.topics.map(t=>[t.id,t]));
  const pools={};
  sel.topics.forEach(t=>{let p=BANK.questions.filter(q=>q.topic===t&&q.level===sel.level);if(!p.length)p=BANK.questions.filter(q=>q.topic===t);pools[t]={all:p,deck:shuffle(p)}});
  const order=[];const tl=shuffle(sel.topics);for(let i=0;i<sel.count;i++)order.push(tl[i%tl.length]);
  const seen=new Set();quiz=[];
  shuffle(order).forEach(t=>{
    let q=null;
    for(let tries=0;tries<30;tries++){
      const P=pools[t];if(!P.deck.length)P.deck=shuffle(P.all);
      const cand=instantiate(P.deck.pop());
      if(cand&&!seen.has(cand.q)){q=cand;break}
      if(cand&&tries>20){q=cand;break}
    }
    if(q){seen.add(q.q);q.topicObj=tmap[t];q.picked=null;quiz.push(q)}
  });
  idx=0;score=0;answered=false;submitted=false;startedAt=Date.now();attemptId=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  $("home").hidden=true;$("quizArea").hidden=false;$("homeBtn").hidden=false;
  render();window.scrollTo({top:0});
}
function render(){
  const total=quiz.length, done=idx+(answered?1:0);
  $("progressTxt").innerHTML=(idx<total?"Question "+(idx+1)+" of "+total:"Finished")+'<span class="tagl">'+esc(CTX.subj.name)+' · '+LVL[sel.level]+'</span>';
  $("scoreTxt").innerHTML="Score <b>"+score+"</b> / "+Math.min(done,total);
  $("progressBar").style.width=(100*done/total)+"%";
  if(idx>=total){renderResults();return}
  const q=quiz[idx];
  let h='<article class="sheet"><span class="qnum">'+(idx+1)+'.</span><span class="tag">'+esc((q.topicObj.ref?q.topicObj.ref+" · ":"")+q.topicObj.name)+'</span>'+
    '<p class="qtext">'+esc(q.q)+'</p>'+(q.graph?'<div class="graph">'+graphSVG(q.graph)+'</div>':'')+
    '<div class="opts'+(q.long?' long':'')+'" role="group" aria-label="Answers">';
  q.opts.forEach((o,i)=>{let c="opt";if(answered){c+=o===q.ans?" ok":o===q.picked?" bad":" dim"}
    h+='<button class="'+c+'" data-i="'+i+'"'+(answered?" disabled":"")+'><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>'});
  h+='</div>';
  if(answered){const ok=q.picked===q.ans;
    h+='<div class="fb'+(ok?"":" no")+'" role="status"><strong>'+(ok?"Correct!":"Not quite. Answer: "+esc(q.ans))+'</strong><p>'+esc(q.expl)+'</p></div>'+
      '<div class="next"><button class="btn primary" id="nextBtn">'+(idx+1<total?"Next question →":"See my results")+'</button></div>'}
  $("stage").innerHTML=h+'</article>';
  $("stage").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  const nb=$("nextBtn");if(nb){nb.addEventListener("click",next);nb.focus({preventScroll:true})}
}
function choose(i){if(answered)return;const q=quiz[idx];q.picked=q.opts[i];if(q.picked===q.ans)score++;answered=true;render()}
function next(){if(!answered)return;answered=false;idx++;render();window.scrollTo({top:0,behavior:"smooth"})}
function topicStats(){const m={};quiz.forEach(q=>{const k=q.topicObj.name;const s=m[k]||(m[k]={ok:0,n:0,ref:q.topicObj.ref});s.n++;if(q.picked===q.ans)s.ok++});return m}
function renderResults(){
  const total=quiz.length,pct=Math.round(100*score/total),easy=sel.level==="easy";
  const msg=pct>=90?(easy?"Excellent! Try the Hard level next.":"Excellent – you are exam ready!"):pct>=70?"Well done. Go through the mistakes below.":pct>=50?"Good effort. A little more practice will help.":"Keep practising – review the explanations below.";
  const ts=topicStats();
  let h='<article class="sheet"><span class="qnum">✓</span><span class="tag">Results · '+esc(CTX.subj.name)+' · '+LVL[sel.level]+'</span>'+
    '<p class="score">'+score+' <small>/ '+total+'</small></p><p style="margin:0;font-weight:700">'+msg+'</p><div class="cats">';
  Object.entries(ts).sort((a,b)=>String(a[1].ref).localeCompare(String(b[1].ref),undefined,{numeric:true})).forEach(([k,s])=>{const p=s.ok/s.n;
    h+='<div class="cat"><span>'+esc(k)+'</span><span class="bar"><i class="'+(p<.6?"low":"")+'" style="width:'+(p*100)+'%"></i></span><span>'+s.ok+' / '+s.n+'</span></div>'});
  h+='</div><div class="row"><button class="btn primary" id="againBtn">New quiz</button>'+(easy&&pct>=70?'<button class="btn" id="upBtn">Try Hard level</button>':'')+'<button class="btn" id="backBtn">Change topics</button></div>';
  const wrong=quiz.filter(q=>q.picked!==q.ans);
  if(wrong.length){h+='<div class="review"><h3>To review ('+wrong.length+')</h3>'+wrong.map(q=>'<div class="rv"><span class="tag">'+esc(q.topicObj.name)+'</span><span>'+esc(q.q)+'</span><span class="y">Your answer: '+esc(q.picked)+'</span><span class="c">Correct answer: '+esc(q.ans)+'</span><span>'+esc(q.expl)+'</span></div>').join("")+'</div>'}
  h+=(ONLINE?'<div class="board" id="rankBox"></div>':'')+'</article>';
  $("stage").innerHTML=h;
  $("againBtn").addEventListener("click",build);
  $("backBtn").addEventListener("click",goHome);
  if($("upBtn"))$("upBtn").addEventListener("click",()=>{sel.level="hard";store.set("gamesol-sel",sel);build()});
  if(ONLINE&&!submitted)submitResult($("rankBox"));
}
function goHome(){$("quizArea").hidden=true;$("home").hidden=false;$("homeBtn").hidden=true;renderHome();window.scrollTo({top:0})}
$("homeBtn").addEventListener("click",goHome);

/* ---------- leaderboard ---------- */
const keyOf=(n,s)=>String(n||"").trim().toLowerCase()+"|"+String(s||"").trim().toLowerCase();
const fmtTime=s=>{s=Math.round(+s||0);return Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")};
function boardHTML(d,cls,subj){
  if(!d||!d.ok)return '<p class="muted">Leaderboard unavailable right now.</p>';
  let h="";
  if(d.me)h+='<div class="rank"><b>#'+d.me.rank+'</b><span>Your rank out of <strong>'+d.players+'</strong> student'+(d.players>1?"s":"")+' · '+esc(cls.name)+' '+esc(subj.name)+' · '+LVL[d.level]+'<br><span class="muted">Your best score: '+d.me.percent+'%</span></span></div>';
  if(!d.top.length)return h+'<p class="muted">No scores yet at this level. Be the first!</p>';
  const me=keyOf(player.name,player.section);let shown=false;
  h+='<div style="overflow-x:auto"><table class="lb"><thead><tr><th>#</th><th>Name</th><th>Section</th><th class="num">Score</th><th class="num">Time</th></tr></thead><tbody>';
  d.top.forEach(r=>{const m=keyOf(r.name,r.section)===me;if(m)shown=true;
    h+='<tr'+(m?' class="me"':'')+'><td>'+r.rank+'</td><td>'+esc(r.name)+(m?" (you)":"")+'</td><td>'+esc(r.section)+'</td><td class="num">'+r.percent+'% <span class="muted">('+r.score+'/'+r.total+')</span></td><td class="num">'+fmtTime(r.seconds)+'</td></tr>'});
  if(d.me&&!shown)h+='<tr><td colspan="5" class="muted">…</td></tr><tr class="me"><td>'+d.me.rank+'</td><td>'+esc(player.name)+' (you)</td><td>'+esc(player.section)+'</td><td class="num">'+d.me.percent+'%</td><td></td></tr>';
  return h+'</tbody></table></div><p class="muted">Best score per student. Ties go to the faster time.</p>';
}
async function submitResult(el){
  el.innerHTML='<p class="muted">Saving your score…</p>';
  const topics={};Object.entries(topicStats()).forEach(([k,s])=>topics[k]={ok:s.ok,n:s.n});
  const payload={name:player.name,section:player.section,cls:CTX.cls.id,subject:CTX.subj.id,chapter:CTX.chap.id,level:sel.level,score,total:quiz.length,seconds:Math.round((Date.now()-startedAt)/1000),topics,attemptId};
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify(payload)});const d=await r.json();
    if(!d.ok)throw new Error(d.error);submitted=true;
    el.innerHTML='<h3>Leaderboard</h3>'+boardHTML(d,CTX.cls,CTX.subj);
  }catch(e){
    el.innerHTML='<p class="warn">Your score could not be saved. Check your internet connection and try again.</p><div class="row"><button class="btn" id="retrySave">Try again</button></div>';
    $("retrySave").addEventListener("click",()=>submitResult(el));
  }
}
async function showBoard(el,cls,subj,level){
  el.hidden=false;
  el.innerHTML='<div class="board"><div class="tabs"><button class="btn small" data-l="easy" aria-pressed="'+(level==="easy")+'">Easy</button><button class="btn small" data-l="hard" aria-pressed="'+(level==="hard")+'">Hard</button></div><div id="sbBody"><p class="muted">Loading…</p></div></div>';
  el.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>showBoard(el,cls,subj,b.dataset.l)));
  try{
    const u=API+(API.includes("?")?"&":"?")+"action=leaderboard&cls="+encodeURIComponent(cls.id)+"&subject="+encodeURIComponent(subj.id)+"&level="+level+"&name="+encodeURIComponent(player.name)+"&section="+encodeURIComponent(player.section);
    $("sbBody").innerHTML=boardHTML(await (await fetch(u)).json(),cls,subj);
  }catch(e){$("sbBody").innerHTML='<p class="warn">Could not load the leaderboard. Check your internet connection.</p>'}
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea")||$("quizArea").hidden)return;
  if(!answered&&/^[1-4]$/.test(e.key)&&idx<quiz.length){const b=$("stage").querySelector('.opt[data-i="'+(+e.key-1)+'"]');if(b)b.click()}
  else if(answered&&(e.key==="Enter"||e.key==="ArrowRight")&&document.activeElement.id!=="nextBtn"){e.preventDefault();next()}
});
boot();
</script>
