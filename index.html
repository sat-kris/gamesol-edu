<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Exam practice quiz games by class and subject">
<title>Gamesol Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="generators.js"></script>
<script src="play.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap">
<style>
:root{
  --paper:#F8F9FD; --sheet:#FFFFFF; --ink:#1D2340; --ink-soft:#5A6082;
  --line:#E3E6F6; --line-strong:#C3C9EE; --margin:#D8454F;
  --accent:#2446C8; --accent-soft:#E6EBFC; --series2:#C2410C;
  --good:#1D7F55; --good-soft:#E3F4EC; --bad:#BF3440; --bad-soft:#FBE7E9;
  --shadow:0 1px 2px rgba(29,35,64,.06),0 8px 28px rgba(29,35,64,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#12152A; --sheet:#1A1E38; --ink:#E7E9F7; --ink-soft:#A3A8C8;
  --line:#242A4C; --line-strong:#353D6E; --margin:#E8656E;
  --accent:#8EA6FF; --accent-soft:#252E5C; --series2:#FB923C;
  --good:#5FD19C; --good-soft:#18362C; --bad:#FF8A93; --bad-soft:#3E1C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#12152A; --sheet:#1A1E38; --ink:#E7E9F7; --ink-soft:#A3A8C8;
  --line:#242A4C; --line-strong:#353D6E; --margin:#E8656E;
  --accent:#8EA6FF; --accent-soft:#252E5C; --series2:#FB923C;
  --good:#5FD19C; --good-soft:#18362C; --bad:#FF8A93; --bad-soft:#3E1C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0}
.sub{margin:4px 0 0;color:var(--ink-soft);font-size:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08);color:var(--sheet)}
.btn.small{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--sheet);border:1px solid var(--line-strong);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0;padding-bottom:0}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.nick{font:inherit;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);flex:1 1 13em;min-width:0;max-width:22em}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.field input{font:inherit;font-weight:400;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink)}
.note,.muted{margin:0;font-size:13.5px;color:var(--ink-soft)}
.choice{position:relative;display:flex}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice>span{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--sheet)}
.choice>span:hover{border-color:var(--accent)}
.choice input:checked+span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.choice strong{font-size:16px}
.choice small{font-size:13px;color:var(--ink-soft)}
.choice .big{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:22px;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);cursor:pointer;font-size:14px}
.pill input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.soon{font-size:13px;color:var(--ink-soft)}
.soon b{font-weight:700}
.topics{display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.topic{display:grid;grid-template-columns:auto 4.2em 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.topic:last-child{border-bottom:0}
.topic:hover{background:var(--accent-soft)}
.topic input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.topic .ref{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.topic .cnt{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.warn{color:var(--bad);font-size:14px;margin:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tagl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-left:6px;border:1px solid var(--line-strong);color:var(--ink-soft)}
#quizArea{display:flex;flex-direction:column;gap:18px}
.sheet{position:relative;background:var(--sheet);border-radius:4px 12px 12px 4px;box-shadow:var(--shadow);padding:26px 22px 22px 58px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line-strong) 31px 32px),repeating-linear-gradient(to bottom,transparent 0 7px,var(--line) 7px 8px);background-position:0 14px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:var(--margin);opacity:.75}
.qnum{position:absolute;left:0;width:40px;top:28px;text-align:center;font-family:"Young Serif",Georgia,serif;color:var(--margin);font-size:15px}
.tag.src{color:var(--series2);background:var(--note)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:4px}
.qtext{white-space:pre-line;font-family:"Young Serif",Georgia,serif;font-size:clamp(19px,3.3vw,23px);line-height:1.5;margin:14px 0 6px;text-wrap:pretty}
.graph{background:var(--sheet);border:1px solid var(--line-strong);border-radius:8px;padding:8px;margin:12px 0 4px;max-width:480px}
.graph svg{display:block;width:100%;height:auto}
.graph text{fill:var(--ink-soft);font-size:12px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.graph .ax{stroke:var(--ink-soft);stroke-width:1.2}
.graph .gl{stroke:var(--line);stroke-width:1}
.graph .l0{stroke:var(--accent);stroke-width:2.5;fill:none}
.graph .l1{stroke:var(--series2);stroke-width:2.5;fill:none}
.graph .fillA{fill:var(--accent-soft)}
.graph .guide{stroke:var(--ink-soft);stroke-dasharray:4 3;stroke-width:1}
.graph .pt{fill:var(--accent);stroke:var(--sheet);stroke-width:2}
.graph .lbl{font-weight:700;font-size:14px}
.graph .lbl0{fill:var(--accent)} .graph .lbl1{fill:var(--series2)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt kbd{font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:4px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok kbd{border-color:var(--good);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad kbd{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:14px 16px;border-radius:8px;border-left:4px solid var(--good);background:var(--good-soft);display:flex;flex-direction:column;gap:4px}
.fb.no{border-left-color:var(--bad);background:var(--bad-soft)}
.fb p{margin:0;font-size:15px}
.next{display:flex;justify-content:flex-end;margin-top:16px}
.score{font-family:"Young Serif",Georgia,serif;font-size:52px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--ink-soft)}
.cats{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.cat{display:grid;grid-template-columns:minmax(0,14em) 1fr 3.5em;gap:10px;align-items:center;font-size:14px}
.cat .bar{height:8px}
.cat .bar i.low{background:var(--bad)}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.review h3,.board h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 0}
.rv{padding:12px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--sheet);font-size:15px;display:flex;flex-direction:column;gap:4px}
.rv .y{color:var(--bad)} .rv .c{color:var(--good)}
.board{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rank{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent)}
.rank b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:34px;line-height:1;color:var(--accent)}
.lb{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.lb th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line-strong)}
.lb td{padding:8px;border-bottom:1px solid var(--line)}
.lb .num{text-align:right}
.lb tr.me td{background:var(--accent-soft);font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.foot{font-size:13px;color:var(--ink-soft);text-align:center}
.error{padding:16px;border-radius:10px;background:var(--bad-soft);color:var(--ink)}
@media (max-width:560px){
  .fields,.grid.two{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .sheet{padding:22px 16px 18px 46px}.sheet::before{left:30px}.qnum{width:30px;font-size:13px}
  .topic{grid-template-columns:auto 1fr;row-gap:2px}.topic .ref{grid-column:2}.topic .cnt{grid-column:2}
  .topic .ref{order:-1}
  .cat{grid-template-columns:1fr 3em}.cat .bar{grid-column:1/-1;order:3}
}

/* ---------- chapter tutor ---------- */
:root{--series3:#0F7B6C;--note:#FFF6DB;--note-ink:#6B4E00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--series3:#4FD1BD;--note:#3A3217;--note-ink:#F3D98B}}
:root[data-theme="dark"]{--series3:#4FD1BD;--note:#3A3217;--note-ink:#F3D98B}
.graph .l2{stroke:var(--series3);stroke-width:2.5;fill:none}
.graph .lbl2{fill:var(--series3)}
.choice.chap>span{position:relative;padding-right:92px;min-height:64px;justify-content:center}
.tutorIcon{position:absolute;top:50%;right:10px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--sheet);border:1.5px solid var(--accent);border-radius:10px;padding:6px 10px;cursor:pointer}
.tutorIcon:hover{background:var(--accent);color:var(--sheet)}
.tutorIcon svg{width:22px;height:22px}
.modes .big svg{width:22px;height:22px;vertical-align:-3px;margin-right:4px;color:var(--accent)}
.lessonList{display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.lessonList button{font:inherit;text-align:left;display:grid;grid-template-columns:2em 4.6em 1fr auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.lessonList button:last-child{border-bottom:0}
.lessonList button:hover{background:var(--accent-soft)}
.lessonList .ok{color:var(--good);font-weight:700}
.lessonList .ref{font-size:13px;color:var(--ink-soft)}
.lessonList .t{font-size:12.5px;color:var(--ink-soft)}
.meter{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.meter .bar{flex:1;height:8px}
.meter .bar i{background:var(--good)}
#tutorArea{display:flex;flex-direction:column;gap:14px}
.tnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tnav button{font:inherit;font-size:13px;font-weight:700;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;flex:none}
.tnav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.tnav button .d{color:var(--good)}
.tnav button[aria-current="page"] .d{color:var(--sheet)}
.lesson{display:flex;flex-direction:column;gap:18px}
.lesson h2.t{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(24px,4.4vw,32px);line-height:1.2;text-transform:none;letter-spacing:0;color:var(--ink);margin:6px 0 0;text-wrap:balance}
.lesson h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.lesson p{margin:0 0 10px;max-width:68ch}
.lesson p:last-child{margin-bottom:0}
.hook{font-family:"Young Serif",Georgia,serif;font-size:18px;line-height:1.55;padding:16px 18px;border-radius:10px;background:var(--accent-soft);border-left:4px solid var(--accent)}
.defs{display:flex;flex-direction:column;gap:0;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--sheet)}
.defs div{display:grid;grid-template-columns:minmax(0,13em) 1fr;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.defs div:last-child{border-bottom:0}
.defs dt{font-weight:700}
.defs dd{margin:0}
.figure{display:flex;flex-direction:column;gap:6px}
.figure .graph{margin:0}
.figure figcaption,.caption{font-size:13.5px;color:var(--ink-soft)}
.nl{background:var(--sheet);border:1px solid var(--line-strong);border-radius:8px;padding:8px;overflow-x:auto}
.nl svg{display:block;width:100%;min-width:560px;height:auto}
.nl text{fill:var(--ink-soft);font-size:12px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.nl .axis{stroke:var(--ink);stroke-width:1.5}
.nl .tick{stroke:var(--ink-soft)}
.nl .pt{fill:var(--accent)}
.nl .pl{fill:var(--ink);font-weight:700;font-size:14px}
.nl .ar{stroke:var(--series2);stroke-width:2;fill:none}
.nl .ar.hl{stroke:var(--accent);stroke-width:3}
.nl .al{fill:var(--ink);font-size:12.5px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;background:var(--sheet)}
.tbl th,.tbl td{border:1px solid var(--line-strong);padding:7px 12px;text-align:center}
.tbl th{background:var(--accent-soft);font-weight:700}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.worked{border:1.5px solid var(--line-strong);border-radius:10px;padding:16px;background:var(--sheet);display:flex;flex-direction:column;gap:10px}
.worked .wq{font-weight:700}
.worked ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.worked .ans{padding:8px 12px;border-radius:6px;background:var(--good-soft);font-weight:700}
.traps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.traps li{padding:9px 12px 9px 36px;border-radius:8px;background:var(--bad-soft);position:relative}
.traps li::before{content:"✕";position:absolute;left:13px;top:8px;color:var(--bad);font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note-card{padding:14px 16px;border-radius:10px;background:var(--note);color:var(--note-ink)}
.note-card h3{color:var(--note-ink)}
.note-card.mem{background:var(--good-soft);color:var(--ink)}
.note-card.mem h3{color:var(--good)}
.asks{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fc{font:inherit;text-align:left;min-height:110px;padding:14px;border-radius:10px;border:1.5px dashed var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.fc:hover{border-color:var(--accent)}
.fc .fq{font-weight:700}
.fc .fa{color:var(--good)}
.fc small{color:var(--ink-soft);font-size:12px;margin-top:auto}
.fc[aria-expanded="true"]{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.lfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.lfoot .spacer{flex:1}
.btn.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px;position:relative}
.rung{position:relative;padding:12px;border-radius:10px;border:1.5px solid var(--accent);background:var(--sheet);display:flex;flex-direction:column;gap:4px}
.rung b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:18px;color:var(--accent)}
.rung i{font-style:normal;font-weight:700;font-size:14px}
.rung small{font-size:13px;color:var(--ink-soft)}
.rung:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700;font-size:18px}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.langs div{padding:12px;border-radius:10px;background:var(--accent-soft)}
.langs b{display:block;margin-bottom:2px}
.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:p}
.plan li{display:grid;grid-template-columns:2.2em 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--sheet);counter-increment:p}
.plan li::before{content:counter(p);font-family:"Young Serif",Georgia,serif;font-size:20px;color:var(--margin);text-align:center}
.plan b{display:block}
.plan small{color:var(--ink-soft)}
.fsheet table{width:100%}
.fsheet td:nth-child(2){font-family:"Young Serif",Georgia,serif;font-size:16px;text-align:left}
.fsheet td{text-align:left}
.rev{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:7px;max-width:72ch}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer}

}

/* ---------- play & learn ---------- */

@keyframes fadein{to{opacity:.85}}
.pline2{stroke:var(--accent);stroke-width:3} .pah{fill:var(--accent)}

.pwedge{fill:var(--series2);fill-opacity:.2;stroke:var(--series2);stroke-width:1.5}

.pdot{fill:var(--ink)}

.pinword{color:var(--accent);font-weight:700}
.pgrid{stroke:var(--line)} .pax{fill:var(--ink-soft);font-size:12px}
.pbar{fill:var(--accent)} .pbar.on{fill:var(--series2)} .pbar2{fill:var(--series2)}
.pguide{stroke:var(--series2);stroke-dasharray:5 4;stroke-width:1.5}
.ptl{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.minitable{display:flex;flex-wrap:wrap;gap:6px}

.seqcard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;min-height:58px;padding:6px 10px;border-radius:12px;background:var(--accent-soft);font-variant-numeric:tabular-nums}
.seqcard b{font-size:22px} .seqcard small{color:var(--series2);font-weight:700}

.cells{display:flex;flex-wrap:wrap;gap:6px}

.cell.on{border-color:var(--accent);background:var(--accent-soft)}
.cell.sc{border-color:var(--good);background:var(--good-soft)} .cell.wrong{border-color:var(--bad);background:var(--bad-soft)}

.pdisplay small{font-size:15px;color:var(--ink-soft)}

.pctl{display:flex;gap:4px}

.sieve{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:460px}
.sieve span{text-align:center;padding:5px 0;border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums;background:var(--paper)}
.sieve span.x{color:var(--ink-soft);text-decoration:line-through;opacity:.45}
.sieve span.p{background:var(--good-soft);color:var(--good);font-weight:700;box-shadow:inset 0 0 0 2px var(--good);border-radius:50%}
.fcompare{display:flex;flex-direction:column;gap:10px}
.fchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.fchips span{padding:3px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.fchips span.com{background:var(--series2);border-color:var(--series2);color:#fff;font-weight:700}
.fchips span.one{background:var(--good-soft);border-color:var(--good);font-weight:700}
.ladder2{display:flex;flex-direction:column;width:max-content;font-size:20px;font-variant-numeric:tabular-nums}
.ladder2 .lr{display:grid;grid-template-columns:3em 5em}
.ladder2 .lp{border-right:2px solid var(--ink);padding:2px 10px;text-align:right;color:var(--series2);font-weight:700}
.ladder2 .lv{border-bottom:2px solid var(--ink);padding:2px 10px}
.playsec{display:flex;flex-direction:column;gap:10px;padding-top:6px}
@media (max-width:640px){.grid.three{grid-template-columns:1fr}.trow{grid-template-columns:6.5em 1fr 4em}.prowi{grid-template-columns:1fr auto}.prowi .icons{grid-column:1/-1;order:3}.dcard{width:46px;height:58px;font-size:28px}}
@media (prefers-reduced-motion:reduce){.pop,.pline{animation:none;opacity:.85}}

.sortcard{font-size:18px;font-weight:700;padding:18px;border-radius:14px;background:var(--note);color:var(--note-ink);text-align:center;min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.4}

@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sortbtns .pbtn{flex:1 1 140px;min-height:48px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.bincards{display:flex;flex-direction:column;gap:4px}
.bincards .mini{font-size:12.5px;padding:4px 7px;border-radius:6px;background:var(--good-soft);line-height:1.35}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{font:inherit;font-size:14.5px;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:48px}
.mitem.on{border-color:var(--accent);background:var(--accent-soft)}
.mitem.ok{border-color:var(--good);background:var(--good-soft);cursor:default}

.obox{display:flex;flex-wrap:wrap;gap:8px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="appName">Gamesol Edu</h1>
      <p class="sub" id="tagline">Exam practice games</p>
    </div>
    <button class="btn" id="homeBtn" hidden>← Change topics</button>
  </header>

  <section class="panel" id="home">
    <p class="muted" id="loading">Loading classes…</p>
  </section>

  <div id="tutorArea" hidden></div>

  <div id="quizArea" hidden>
    <div class="meta"><span id="progressTxt"></span><span id="scoreTxt"></span></div>
    <div class="bar" aria-hidden="true"><i id="progressBar" style="width:0"></i></div>
    <main id="stage"></main>
  </div>
  <p class="foot">New questions every time: numbers change and answers are shuffled. Press 1–4 to answer and Enter to continue.</p>
</div>

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LVL={easy:"Easy",hard:"Hard",advanced:"Advanced"};

let CONFIG=null, API="", ONLINE=false;
const NICK_A=["NoCap","Lowkey","BigBrain","MainCharacter","Certified","Vibey","Slay","Chill","Turbo","Sneaky","Mega","Goated","Epic","Galaxy","Glowup","Speedy","Cosmic","Hyper"];
const NICK_B=["Panda","Mango","Ninja","Comet","Otter","Pixel","Tiger","Falcon","Nova","Koala","Rocket","Dragon","Samosa","Boba","Llama","Penguin","Wizard","Legend"];
const nick=()=>NICK_A[Math.floor(Math.random()*NICK_A.length)]+NICK_B[Math.floor(Math.random()*NICK_B.length)]+(10+Math.floor(Math.random()*90));
let player=Object.assign({name:"",auto:""},store.get("gamesol-player")||{});player.section="";
if(!player.auto){player.auto=nick();store.set("gamesol-player",player)}
const pname=()=>player.name||player.auto;
let sel=Object.assign({cls:null,subject:null,chapter:null,topics:null,level:null,count:15,mode:null},store.get("gamesol-sel")||{});
let BANK=null;
const bankCache={};

/* ---------- load config ---------- */
async function boot(){
  try{
    const r=await fetch("edu-kids-config.json",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    CONFIG=await r.json();
  }catch(e){
    $("home").innerHTML='<div class="error"><strong>Could not load edu-kids-config.json.</strong><br>Open this page from GitHub Pages (or a local web server). Opening the file directly from your computer does not allow it to read the config file.</div>';
    return;
  }
  if(CONFIG.appName){$("appName").textContent=CONFIG.appName;document.title=CONFIG.appName}
  if(CONFIG.tagline)$("tagline").textContent=CONFIG.tagline;
  API=String(CONFIG.leaderboard&&CONFIG.leaderboard.scriptUrl||"").trim();
  ONLINE=/^https:\/\/script\.google(usercontent)?\.com\//.test(API);
  renderHome();
}
const ongoing=list=>(list||[]).filter(x=>String(x.status||"").toLowerCase()==="ongoing");
const notOngoing=list=>(list||[]).filter(x=>String(x.status||"").toLowerCase()!=="ongoing");

/* ---------- home / selection ---------- */
function renderHome(){
  const classes=ongoing(CONFIG.classes);
  if(!classes.find(c=>c.id===sel.cls)) sel.cls=classes.length===1?classes[0].id:null;
  const cls=classes.find(c=>c.id===sel.cls);
  const subjects=cls?ongoing(cls.subjects):[];
  if(!subjects.find(s=>s.id===sel.subject)) sel.subject=subjects.length===1?subjects[0].id:null;
  const subj=subjects.find(s=>s.id===sel.subject);
  const chapters=subj&&!subj.link?ongoing(subj.chapters):[];
  if(!chapters.find(c=>c.id===sel.chapter)) sel.chapter=chapters.length?chapters[0].id:null;
  const chap=chapters.find(c=>c.id===sel.chapter);

  let h="";
  if(ONLINE){
    h+='<div class="step"><h2>Your game name <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></h2><div class="row">'+
      '<input id="pName" class="nick" type="text" maxlength="30" autocomplete="off" aria-label="Your game name" placeholder="'+esc(player.auto)+'" value="'+esc(player.name)+'">'+
      '<button type="button" class="btn small" id="nickBtn" title="Pick a new random name">🎲 New name</button></div>'+
      '<p class="note">You’ll play as <b id="nickShow">'+esc(pname())+'</b> on the leaderboard. Type your own if you like – keep it the same so your scores count together.</p></div>';
  }
  h+='<div class="step"><h2>Class</h2><div class="pills">'+
    (classes.length?classes.map(c=>'<label class="pill"><input type="radio" name="cls" value="'+esc(c.id)+'"'+(c.id===sel.cls?" checked":"")+'><span>'+esc(c.name)+'</span></label>').join(""):'<p class="muted">No class is marked as ongoing in the config file.</p>')+
    '</div>'+soonLine(notOngoing(CONFIG.classes))+'</div>';
  if(cls){
    h+='<div class="step"><h2>Subject</h2><div class="grid">'+
      (subjects.length?subjects.map(s=>'<label class="choice"><input type="radio" name="subject" value="'+esc(s.id)+'"'+(s.id===sel.subject?" checked":"")+'><span><strong>'+esc(s.name)+'</strong><small>'+esc(s.link?(s.note||"Opens its own game"):(ongoing(s.chapters).length+" chapter"+(ongoing(s.chapters).length===1?"":"s")+" open"))+'</small></span></label>').join(""):'<p class="muted">No subject is ongoing for this class yet.</p>')+
      '</div>'+soonLine(notOngoing(cls.subjects))+'</div>';
  }
  if(subj&&subj.link){
    h+='<div class="step"><h2>'+esc(subj.name)+'</h2><p class="muted">'+esc(subj.note||"")+'</p><div class="row"><a class="btn primary" href="'+esc(subj.link)+'">Open '+esc(subj.name)+' game →</a></div></div>';
  }else if(subj){
    h+='<div class="step"><h2>Chapter</h2><div class="grid two">'+
      chapters.map(c=>'<label class="choice chap"><input type="radio" name="chapter" value="'+esc(c.id)+'"'+(c.id===sel.chapter?" checked":"")+'><span><strong>'+esc(c.name)+'</strong>'+
        (c.tutor?'<small>'+tutorProgressText(c)+'</small><button type="button" class="tutorIcon" data-tutor="'+esc(c.id)+'" title="Open the chapter tutor" aria-label="Open the chapter tutor for '+esc(c.name)+'">'+ICON_BOOK+'<span>Tutor</span></button>':'')+
        '</span></label>').join("")+
      '</div>'+soonLine(notOngoing(subj.chapters))+'</div>';
    if(chap&&chap.tutor){
      if(!["tutor","quiz","play"].includes(sel.mode))sel.mode="tutor";
      h+='<div class="step"><h2>What do you want to do?</h2><div class="grid three modes">'+
        '<label class="choice"><input type="radio" name="mode" value="play"'+(sel.mode==="play"?" checked":"")+'><span><span class="big">'+ICON_PLAY+' Play &amp; learn</span><small>Hands-on activities: drag, tap and build to see how each idea works. Great for starting a topic.</small></span></label>'+
        '<label class="choice"><input type="radio" name="mode" value="tutor"'+(sel.mode==="tutor"?" checked":"")+'><span><span class="big">'+ICON_BOOK+' Chapter tutor</span><small>Learn each topic simply, see worked examples, then revise smart and get exam-ready.</small></span></label>'+
        '<label class="choice"><input type="radio" name="mode" value="quiz"'+(sel.mode==="quiz"?" checked":"")+'><span><span class="big">'+ICON_CHECK+' Check knowledge</span><small>Quiz yourself on chosen topics at Easy, Hard or Advanced level and see your rank.</small></span></label>'+
        '</div></div>';
    }else sel.mode="quiz";
    h+='<div class="step" id="topicStep"><h2>Topics</h2><p class="muted">Loading topics…</p></div>';
  }
  $("home").innerHTML=h;
  $("home").querySelectorAll('input[name="cls"]').forEach(i=>i.addEventListener("change",()=>{sel.cls=i.value;sel.subject=null;keepNames();renderHome()}));
  $("home").querySelectorAll('input[name="subject"]').forEach(i=>i.addEventListener("change",()=>{sel.subject=i.value;sel.chapter=null;sel.topics=null;keepNames();renderHome()}));
  $("home").querySelectorAll('input[name="chapter"]').forEach(i=>i.addEventListener("change",()=>{sel.chapter=i.value;sel.topics=null;keepNames();renderHome()}));
  $("home").querySelectorAll('input[name="mode"]').forEach(i=>i.addEventListener("change",()=>{sel.mode=i.value;store.set("gamesol-sel",sel);keepNames();renderHome()}));
  if($("nickBtn")){$("nickBtn").addEventListener("click",()=>{player.auto=nick();player.name="";$("pName").value="";$("pName").placeholder=player.auto;$("nickShow").textContent=pname();store.set("gamesol-player",player)});
    $("pName").addEventListener("input",()=>{player.name=$("pName").value.replace(/\s+/g," ").trim();$("nickShow").textContent=pname();store.set("gamesol-player",player)})}
  $("home").querySelectorAll('.tutorIcon').forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const c=chapters.find(x=>x.id===b.dataset.tutor);sel.chapter=c.id;keepNames();openTutor(cls,subj,c,"overview")}));
  if(chap&&chap.tutor&&sel.mode==="play") loadTutor(chap).then(t=>renderPlaySummary(t,cls,subj,chap)).catch(()=>{$("topicStep").innerHTML='<p class="warn">Could not load the tutor file "'+esc(chap.tutor)+'".</p>'});
  else if(chap&&chap.tutor&&sel.mode==="tutor") loadTutor(chap).then(t=>renderTutorSummary(t,cls,subj,chap)).catch(()=>{$("topicStep").innerHTML='<h2>Chapter tutor</h2><p class="warn">Could not load the tutor file "'+esc(chap.tutor)+'". Check the path in edu-kids-config.json.</p>'});
  else if(chap) loadBank(chap).then(b=>renderTopics(b,cls,subj,chap)).catch(()=>{$("topicStep").innerHTML='<h2>Topics</h2><p class="warn">Could not load the question bank "'+esc(chap.bank)+'". Check the path in edu-kids-config.json.</p>'});
}
function soonLine(list){return list.length?'<p class="soon">Coming soon: '+list.map(x=>'<b>'+esc(x.name)+'</b>').join(", ")+'</p>':""}
function keepNames(){if($("pName")){player.name=$("pName").value.replace(/\s+/g," ").trim();store.set("gamesol-player",player)}}
async function loadBank(chap){
  if(bankCache[chap.bank]) return bankCache[chap.bank];
  const r=await fetch(chap.bank,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
  const bank=await r.json();
  for(const x of await loadExtras(chap)){
    (x.topics||[]).forEach(t=>{if(!bank.topics.some(b=>b.id===t.id))bank.topics.push(t)});
    (x.questions||[]).forEach(q=>bank.questions.push(Object.assign({src:x.label||"Extra practice"},q)));
    (bank.extraSources=bank.extraSources||[]).push(x.source||x.label);
  }
  return bankCache[chap.bank]=bank;
}
/* Extra sources (e.g. school worksheets) listed in a chapter's "extras". Any path inside a folder named in
   the config's "exclude" list is skipped, so a whole folder of extras can be switched off in one line. */
const extrasCache={};
function extraPaths(chap){const ex=(CONFIG.exclude||[]).map(x=>String(x).toLowerCase());
  return (chap.extras||[]).filter(p=>!String(p).toLowerCase().split("/").slice(0,-1).some(seg=>ex.includes(seg)))}
async function loadExtras(chap){const out=[];
  for(const p of extraPaths(chap)){try{if(!extrasCache[p]){const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw new Error(r.status);extrasCache[p]=await r.json()}out.push(extrasCache[p])}catch(e){console.warn("Skipped extra source",p,e)}}
  return out}
function renderTopics(bank,cls,subj,chap){
  BANK=bank;
  const ids=bank.topics.map(t=>t.id);
  if(!Array.isArray(sel.topics)||!sel.topics.some(t=>ids.includes(t))) sel.topics=ids.slice();

    '<div class="topics">'+bank.topics.map(t=>'<label class="topic" for="t-'+esc(t.id)+'"><input type="checkbox" id="t-'+esc(t.id)+'" value="'+esc(t.id)+'"'+(sel.topics.includes(t.id)?" checked":"")+'><span class="ref">'+esc(t.ref||"")+'</span><span>'+esc(t.name)+'</span><span class="cnt">'+cnt(t.id,"easy")+' easy · '+cnt(t.id,"hard")+' hard'+(hasAdv?' · '+cnt(t.id,"advanced")+' adv.':'')+'</span></label>').join("")+'</div>'+
    '<p class="note">Source: '+esc(bank.source||bank.chapter)+'.'+(bank.extraSources?' Also includes: '+esc(bank.extraSources.join("; "))+' (tagged in the quiz).':'')+' Numerical questions use new numbers every time.</p>';
  h+='</div><div class="step"><h2>Level</h2><div class="grid three">'+
    ['easy','hard','advanced'].map(l=>'<label class="choice"><input type="radio" name="level" value="'+l+'"'+(sel.level===l?" checked":"")+'><span><span class="big">'+LVL[l]+'</span><small>'+esc((bank.levelNotes||{})[l]||LEVEL_NOTE[l])+'</small></span></label>').join("")+
    '</div></div><div class="step"><h2>Number of questions</h2><div class="pills">'+
    [10,15,20,30].map(n=>'<label class="pill"><input type="radio" name="count" value="'+n+'"'+(sel.count===n?" checked":"")+'><span>'+n+'</span></label>').join("")+
    '</div><p class="warn" id="warn" hidden></p><div class="row"><button class="btn primary" id="startBtn">Start quiz</button>'+(ONLINE?'<button class="btn" id="boardBtn">Leaderboard</button>':'')+'</div><div id="startBoard" hidden></div>';
  const step=$("topicStep");step.innerHTML=h;
  const boxes=()=>[...step.querySelectorAll('.topics input')];
  $("allT").addEventListener("click",()=>boxes().forEach(b=>b.checked=true));

  $("startBtn").addEventListener("click",()=>start(cls,subj,chap,boxes()));
  if(ONLINE)$("boardBtn").addEventListener("click",()=>{const sb=$("startBoard");if(!sb.hidden){sb.hidden=true;return}keepNames();const l=document.querySelector('input[name="level"]:checked');showBoard(sb,cls,subj,l?l.value:"easy")});
}
function start(cls,subj,chap,boxes){
  const warn=$("warn");const say=m=>{warn.textContent=m;warn.hidden=false};
  keepNames();
  const topics=boxes.filter(b=>b.checked).map(b=>b.value);
  if(!topics.length){say("Please choose at least one topic.");return}
  const lv=document.querySelector('input[name="level"]:checked');
  if(!lv){say("Please choose a level: Easy, Hard or Advanced.");return}
  warn.hidden=true;
  sel.topics=topics;sel.level=lv.value;sel.count=+document.querySelector('input[name="count"]:checked').value;
  store.set("gamesol-sel",sel);store.set("gamesol-player",player);
  CTX={cls,subj,chap};
  build();
}

const LEVEL_NOTE={easy:"Key facts, definitions and one-step questions.",hard:"Exam-style reasoning and multi-step questions.",advanced:"Stretch yourself: tricky, multi-step and unfamiliar questions – still from the same syllabus."};
/* ---------- question generation ---------- */
function evalIn(expr,env){const k=Object.keys(env);return Function(...k,'"use strict";return ('+expr+');')(...k.map(x=>env[x]))}
function pickVar(spec){
  if(Array.isArray(spec)){const [a,b,s]=spec;const n=Math.floor((b-a)/(s||1));return +(a+(s||1)*Math.floor(Math.random()*(n+1))).toFixed(6)}
  if(spec&&spec.of)return rnd(spec.of);
  return spec;
}
function fmt(x,dp){
  if(typeof x!=="number")return String(x);
  const r=Math.round(x*Math.pow(10,dp))/Math.pow(10,dp);
  return (Object.is(r,-0)?0:r).toString().replace(/^-/,"−");
}
function fill(t,env,ansStr){return String(t).replace(/\{(\w+)\}/g,(m,k)=>k==="ans"?ansStr:(k in env?fmt(env[k],2):m))}
function instantiate(item){
  if(item.type==="fn"){
    const G=window.GEN&&window.GEN[item.fn];if(!G)return null;
    for(let t=0;t<20;t++){const r=G(item.args||{});if(r){const opts=shuffle([r.ans,...r.wrong]);return {topic:item.topic,q:r.q,ans:r.ans,opts,expl:r.expl,graph:r.fig||null,long:opts.some(o=>String(o).length>34)}}}
    return null;
  }
  if(item.type==="pairs"){
    const P=item.pairs,k=Math.floor(Math.random()*P.length),[x,ans]=P[k];
    let w=[...new Set(P.map(p=>p[1]).concat(item.extra||[]))].filter(v=>v!==ans);w=shuffle(w).slice(0,3);if(w.length<2)return null;
    const opts=shuffle([ans,...w]);
    return {topic:item.topic,q:item.q.replace("{x}",x),ans,opts,expl:(item.e||"").replace("{x}",x).replace("{ans}",ans),passage:item.passage||null,graph:null,long:opts.some(o=>o.length>34)};
  }
  if(item.type!=="calc"){
    return {passage:item.passage||null,topic:item.topic,q:item.q,ans:item.a,opts:shuffle([item.a,...item.w]),expl:item.e,graph:item.graph?resolveGraph(item.graph,{}):null,long:[item.a,...item.w].some(o=>o.length>34)};
  }
  const dp=item.dp??2;
  for(let tries=0;tries<60;tries++){
    const env={};
    for(const k in item.vars) env[k]=pickVar(item.vars[k]);
    try{
      for(const k in (item.derive||{})) env[k]=evalIn(item.derive[k],env);
      if(item.where&&!evalIn(item.where,env)) continue;
      const a=evalIn(item.answer,env); if(!isFinite(a)) continue;
      const u=item.unit?(/^[°%]/.test(item.unit)?"":" ")+item.unit:"";
      const ans=fmt(a,dp)+u;
      let wrong=[...new Set(item.wrong.map(w=>{try{const v=evalIn(w,env);return isFinite(v)?fmt(v,dp)+u:null}catch(e){return null}}).filter(w=>w&&w!==ans))];
      const extra=[a*2,a/2,a*10,a+ (Math.abs(a)>=1?1:0.5),a*1.5];let i=0;
      while(wrong.length<3&&i<extra.length){const w=fmt(extra[i++],dp)+u;if(w!==ans&&!wrong.includes(w))wrong.push(w)}
      wrong=shuffle(wrong).slice(0,3);
      return {topic:item.topic,q:fill(item.q,env,fmt(a,dp)),ans,opts:shuffle([ans,...wrong]),expl:fill(item.e,env,fmt(a,dp)),graph:item.graph?resolveGraph(item.graph,env):null,passage:item.passage?fill(item.passage,env,fmt(a,dp)):null,calc:true};
    }catch(e){continue}
  }
  return null;
}
function resolveGraph(g,env){
  const val=v=>typeof v==="string"?evalIn(v,env):v;
  if(!g.lines){const sub=x=>typeof x==="string"&&x[0]==="="?evalIn(x.slice(1),env):Array.isArray(x)?x.map(sub):x&&typeof x==="object"?Object.fromEntries(Object.entries(x).map(([k,v])=>[k,sub(v)])):x;return sub(g)}
  return Object.assign({},g,{lines:g.lines.map(l=>Object.assign({},l,{pts:l.pts.map(p=>[val(p[0]),val(p[1])])}))});
}
function niceStep(max,target){const raw=max/(target||5);const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function graphSVG(g){
  const W=460,H=250,L=52,R=18,T=16,B=44;
  const all=g.lines.flatMap(l=>l.pts);
  const xmax0=Math.max(...all.map(p=>p[0]));let ymax0=g.ymax||Math.max(...all.map(p=>p[1]));
  const xs=niceStep(xmax0,6),ys=niceStep(ymax0,5);
  const xmax=Math.ceil(xmax0/xs)*xs, ymax=Math.max(ys,Math.ceil(ymax0*1.08/ys)*ys);
  const X=x=>L+(W-L-R)*x/xmax, Y=y=>T+(H-T-B)*(1-y/ymax);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.y+" against "+g.x)+' graph">';
  for(let y=0;y<=ymax+1e-9;y+=ys)s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y)+'" y2="'+Y(y)+'"/><text x="'+(L-7)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+fmt(y,2)+'</text>';
  for(let x=0;x<=xmax+1e-9;x+=xs)s+='<text x="'+X(x)+'" y="'+(H-B+16)+'" text-anchor="middle">'+fmt(x,2)+'</text>';
  if(g.fill&&g.lines[0]){const p=g.lines[0].pts;s+='<path class="fillA" d="M'+X(p[0][0])+' '+Y(0)+p.map(q=>'L'+X(q[0])+' '+Y(q[1])).join("")+'L'+X(p[p.length-1][0])+' '+Y(0)+'Z"/>'}
  s+='<line class="ax" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'"/><line class="ax" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>';
  g.lines.forEach((l,i)=>{
    s+='<polyline class="l'+(i%3)+'" points="'+l.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")+'"/>';
    if(l.label){const p=l.pts[l.pts.length-1];s+='<text class="lbl lbl'+(i%3)+'" x="'+(X(p[0])-8)+'" y="'+(Y(p[1])-8)+'" text-anchor="end">'+esc(l.label)+'</text>'}
  });
  if(g.mark){g.lines[0].pts.forEach(p=>{if(p[0]===0&&p[1]===0)return;
    s+='<line class="guide" x1="'+X(p[0])+'" y1="'+Y(p[1])+'" x2="'+X(p[0])+'" y2="'+(H-B)+'"/><line class="guide" x1="'+L+'" y1="'+Y(p[1])+'" x2="'+X(p[0])+'" y2="'+Y(p[1])+'"/><circle class="pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5"/>'+
      '<text x="'+(X(p[0])+8)+'" y="'+(Y(p[1])-8)+'">('+fmt(p[0],2)+', '+fmt(p[1],2)+')</text>'})}
  s+='<text x="'+((L+W-R)/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(g.x)+'</text>';
  s+='<text transform="translate(14,'+((T+H-B)/2)+') rotate(-90)" text-anchor="middle">'+esc(g.y)+'</text>';
  return s+'</svg>';
}

/* ---------- quiz ---------- */
let CTX=null, quiz=[], idx=0, score=0, answered=false, startedAt=0, attemptId="", submitted=false;
function build(){
  const tmap=Object.fromEntries(BANK.topics.map(t=>[t.id,t]));
  const pools={};
  sel.topics.forEach(t=>{let p=BANK.questions.filter(q=>q.topic===t&&q.level===sel.level);if(!p.length&&sel.level==="advanced")p=BANK.questions.filter(q=>q.topic===t&&q.level==="hard");if(!p.length)p=BANK.questions.filter(q=>q.topic===t);pools[t]={all:p,deck:shuffle(p)}});
  const order=[];const tl=shuffle(sel.topics);for(let i=0;i<sel.count;i++)order.push(tl[i%tl.length]);
  const seen=new Set();quiz=[];
  shuffle(order).forEach(t=>{
    let q=null;
    for(let tries=0;tries<30;tries++){
      const P=pools[t];if(!P.deck.length)P.deck=shuffle(P.all);
      const it=P.deck.pop(),cand=instantiate(it);if(cand&&it.src)cand.src=it.src;
      if(cand&&!seen.has(cand.q)){q=cand;break}
      if(cand&&tries>20){q=cand;break}
    }
    if(q){seen.add(q.q);q.topicObj=tmap[t];q.picked=null;quiz.push(q)}
  });
  idx=0;score=0;answered=false;submitted=false;startedAt=Date.now();attemptId=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  $("home").hidden=true;$("tutorArea").hidden=true;$("quizArea").hidden=false;$("homeBtn").hidden=false;
  render();window.scrollTo({top:0});
}
function render(){
  const total=quiz.length, done=idx+(answered?1:0);
  $("progressTxt").innerHTML=(idx<total?"Question "+(idx+1)+" of "+total:"Finished")+'<span class="tagl">'+esc(CTX.subj.name)+' · '+LVL[sel.level]+'</span>';
  $("scoreTxt").innerHTML="Score <b>"+score+"</b> / "+Math.min(done,total);
  $("progressBar").style.width=(100*done/total)+"%";
  if(idx>=total){renderResults();return}
  const q=quiz[idx];
  let h='<article class="sheet"><span class="qnum">'+(idx+1)+'.</span><span class="tag">'+esc((q.topicObj.ref?q.topicObj.ref+" · ":"")+q.topicObj.name)+'</span>'+(q.src?' <span class="tag src">'+esc(q.src)+'</span>':'')+
    (q.passage?'<div class="passage">'+esc(q.passage)+'</div>':'')+'<p class="qtext">'+esc(q.q)+'</p>'+(q.graph?figBox(q.graph):'')+
    '<div class="opts'+(q.long?' long':'')+'" role="group" aria-label="Answers">';
  q.opts.forEach((o,i)=>{let c="opt";if(answered){c+=o===q.ans?" ok":o===q.picked?" bad":" dim"}
    h+='<button class="'+c+'" data-i="'+i+'"'+(answered?" disabled":"")+'><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>'});
  h+='</div>';
  if(answered){const ok=q.picked===q.ans;
    h+='<div class="fb'+(ok?"":" no")+'" role="status"><strong>'+(ok?"Correct!":"Not quite. Answer: "+esc(q.ans))+'</strong><p>'+esc(q.expl)+'</p></div>'+
      '<div class="next"><button class="btn primary" id="nextBtn">'+(idx+1<total?"Next question →":"See my results")+'</button></div>'}
  $("stage").innerHTML=h+'</article>';
  $("stage").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  const nb=$("nextBtn");if(nb){nb.addEventListener("click",next);nb.focus({preventScroll:true})}
}
function choose(i){if(answered)return;const q=quiz[idx];q.picked=q.opts[i];if(q.picked===q.ans)score++;answered=true;render()}
function next(){if(!answered)return;answered=false;idx++;render();window.scrollTo({top:0,behavior:"smooth"})}
function topicStats(){const m={};quiz.forEach(q=>{const k=q.topicObj.name;const s=m[k]||(m[k]={ok:0,n:0,ref:q.topicObj.ref});s.n++;if(q.picked===q.ans)s.ok++});return m}
function renderResults(){
  const total=quiz.length,pct=Math.round(100*score/total),easy=sel.level==="easy",up=sel.level==="easy"?"hard":sel.level==="hard"?"advanced":null;
  const msg=pct>=90?(up?"Excellent! Try the "+LVL[up]+" level next.":"Outstanding – you can handle the toughest questions in this syllabus!"):pct>=70?"Well done. Go through the mistakes below.":pct>=50?"Good effort. A little more practice will help.":"Keep practising – review the explanations below.";
  const ts=topicStats();
  let h='<article class="sheet"><span class="qnum">✓</span><span class="tag">Results · '+esc(CTX.subj.name)+' · '+LVL[sel.level]+'</span>'+
    '<p class="score">'+score+' <small>/ '+total+'</small></p><p style="margin:0;font-weight:700">'+msg+'</p><div class="cats">';
  Object.entries(ts).sort((a,b)=>String(a[1].ref).localeCompare(String(b[1].ref),undefined,{numeric:true})).forEach(([k,s])=>{const p=s.ok/s.n;
    h+='<div class="cat"><span>'+esc(k)+'</span><span class="bar"><i class="'+(p<.6?"low":"")+'" style="width:'+(p*100)+'%"></i></span><span>'+s.ok+' / '+s.n+'</span></div>'});
  h+='</div><div class="row"><button class="btn primary" id="againBtn">New quiz</button>'+(up&&pct>=70?'<button class="btn" id="upBtn">Try '+LVL[up]+' level</button>':'')+'<button class="btn" id="backBtn">Change topics</button></div>';
  const wrong=quiz.filter(q=>q.picked!==q.ans);
  if(wrong.length){h+='<div class="review"><h3>To review ('+wrong.length+')</h3>'+wrong.map(q=>'<div class="rv"><span class="tag">'+esc(q.topicObj.name)+'</span><span>'+esc(q.q)+'</span><span class="y">Your answer: '+esc(q.picked)+'</span><span class="c">Correct answer: '+esc(q.ans)+'</span><span>'+esc(q.expl)+'</span></div>').join("")+'</div>'}
  h+=(ONLINE?'<div class="board" id="rankBox"></div>':'')+'</article>';
  $("stage").innerHTML=h;
  $("againBtn").addEventListener("click",build);
  $("backBtn").addEventListener("click",goHome);
  if($("upBtn"))$("upBtn").addEventListener("click",()=>{sel.level=up;store.set("gamesol-sel",sel);build()});
  if(ONLINE&&!submitted)submitResult($("rankBox"));
}
function goHome(){$("quizArea").hidden=true;$("tutorArea").hidden=true;$("home").hidden=false;$("homeBtn").hidden=true;renderHome();window.scrollTo({top:0})}
$("homeBtn").addEventListener("click",goHome);

/* ---------- leaderboard ---------- */
const keyOf=(n,s)=>String(n||"").trim().toLowerCase()+"|"+String(s||"").trim().toLowerCase();
const fmtTime=s=>{s=Math.round(+s||0);return Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")};
function boardHTML(d,cls,subj){
  if(!d||!d.ok)return '<p class="muted">Leaderboard unavailable right now.</p>';
  let h="";
  if(d.me)h+='<div class="rank"><b>#'+d.me.rank+'</b><span>Your rank out of <strong>'+d.players+'</strong> student'+(d.players>1?"s":"")+' · '+esc(cls.name)+' '+esc(subj.name)+' · '+LVL[d.level]+'<br><span class="muted">Your best score: '+d.me.percent+'%</span></span></div>';
  if(!d.top.length)return h+'<p class="muted">No scores yet at this level. Be the first!</p>';
  const me=keyOf(pname(),"");let shown=false;
  h+='<div style="overflow-x:auto"><table class="lb"><thead><tr><th>#</th><th>Name</th><th class="num">Score</th><th class="num">Time</th></tr></thead><tbody>';
  d.top.forEach(r=>{const m=keyOf(r.name,"")===me;if(m)shown=true;
    h+='<tr'+(m?' class="me"':'')+'><td>'+r.rank+'</td><td>'+esc(r.name)+(m?" (you)":"")+'</td><td class="num">'+r.percent+'% <span class="muted">('+r.score+'/'+r.total+')</span></td><td class="num">'+fmtTime(r.seconds)+'</td></tr>'});
  if(d.me&&!shown)h+='<tr><td colspan="4" class="muted">…</td></tr><tr class="me"><td>'+d.me.rank+'</td><td>'+esc(pname())+' (you)</td><td class="num">'+d.me.percent+'%</td><td></td></tr>';
  return h+'</tbody></table></div><p class="muted">Best score per student. Ties go to the faster time.</p>';
}
async function submitResult(el){
  el.innerHTML='<p class="muted">Saving your score…</p>';
  const topics={};Object.entries(topicStats()).forEach(([k,s])=>topics[k]={ok:s.ok,n:s.n});
  const payload={name:pname(),section:"",cls:CTX.cls.id,subject:CTX.subj.id,chapter:CTX.chap.id,level:sel.level,score,total:quiz.length,seconds:Math.round((Date.now()-startedAt)/1000),topics,attemptId};
  try{
    const r=await fetch(API,{method:"POST",body:JSON.stringify(payload)});const d=await r.json();
    if(!d.ok)throw new Error(d.error);submitted=true;
    el.innerHTML='<h3>Leaderboard</h3>'+boardHTML(d,CTX.cls,CTX.subj);
  }catch(e){
    el.innerHTML='<p class="warn">Your score could not be saved. Check your internet connection and try again.</p><div class="row"><button class="btn" id="retrySave">Try again</button></div>';
    $("retrySave").addEventListener("click",()=>submitResult(el));
  }
}
async function showBoard(el,cls,subj,level){

  el.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>showBoard(el,cls,subj,b.dataset.l)));

const tutorCache={};
async function loadTutor(chap){
  if(tutorCache[chap.tutor])return tutorCache[chap.tutor];
  const r=await fetch(chap.tutor,{cache:"no-store"});if(!r.ok)throw new Error(r.status);
  const T=await r.json();
  for(const x of await loadExtras(chap))(x.play||[]).forEach(p=>{const l=T.lessons.find(l=>l.topic===p.topic)||T.lessons[0];l.play=(l.play||[]).concat([Object.assign({src:x.label||"Extra practice"},p.activity)])});
  return tutorCache[chap.tutor]=T;
}

function numberlineSVG(d){
  const W=600,L=30,R=30,rows=Math.max(0,...(d.arrows||[]).map(a=>a.row||1));
  const top=16+rows*30,axisY=top+34,H=axisY+ (d.points.some(p=>p.sub)?56:40);
  const X=v=>L+(W-L-R)*(v-d.min)/(d.max-d.min);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Number line diagram"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>';
  s+='<line class="axis" x1="'+(L-12)+'" y1="'+axisY+'" x2="'+(W-R+12)+'" y2="'+axisY+'"/>';
  for(let v=d.min;v<=d.max+1e-9;v+=d.step)s+='<line class="tick" x1="'+X(v)+'" x2="'+X(v)+'" y1="'+(axisY-5)+'" y2="'+(axisY+5)+'"/><text x="'+X(v)+'" y="'+(axisY+20)+'" text-anchor="middle">'+(v>0?"+":"")+fmt(v,1)+' '+esc(d.unit||"")+'</text>';
  (d.points||[]).forEach(p=>{s+='<circle class="pt" cx="'+X(p.x)+'" cy="'+axisY+'" r="5"/><text class="pl" x="'+X(p.x)+'" y="'+(axisY-11)+'" text-anchor="middle">'+esc(p.label)+'</text>'+(p.sub?'<text x="'+X(p.x)+'" y="'+(axisY+38)+'" text-anchor="middle">'+esc(p.sub)+'</text>':'')});
  (d.arrows||[]).forEach(a=>{const y=16+((a.row||1)-1)*30+14;const x1=X(a.from),x2=X(a.to);
    s+='<line class="ar'+(a.hl?" hl":"")+'" x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" marker-end="url(#ah)"/><text class="al" x="'+((x1+x2)/2)+'" y="'+(y-5)+'" text-anchor="middle">'+esc(a.label)+'</text>'});
  return s+'</svg>';
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea")||$("quizArea").hidden)return;
  if(!answered&&/^[1-4]$/.test(e.key)&&idx<quiz.length){const b=$("stage").querySelector('.opt[data-i="'+(+e.key-1)+'"]');if(b)b.click()}
  else if(answered&&(e.key==="Enter"||e.key==="ArrowRight")&&document.activeElement.id!=="nextBtn"){e.preventDefault();next()}
});
boot();
</script>
